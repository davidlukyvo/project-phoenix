<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SV lifecycle monogram">
  <rect width="128" height="128" rx="26" fill="#0D1B2A"/>

  <!-- Lifecycle ring: four flat segments with equal gaps -->
  <path d="M18 59 A46 46 0 0 1 59 18" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="butt"/>
  <path d="M69 18 A46 46 0 0 1 110 59" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="butt"/>
  <path d="M110 69 A46 46 0 0 1 69 110" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="butt"/>
  <path d="M59 110 A46 46 0 0 1 18 69" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="butt"/>

  <!-- Geometric S: optically centered and balanced -->
  <path d="M43 34H86L78 44H52L44 52V57L51 64H68L80 76V84L70 94H40L47 84H65L72 78V76L66 70H48L36 58V47Z" fill="#FFFFFF"/>

  <!-- Angular V: fully contained inside the ring, no overlap with ring segments -->
