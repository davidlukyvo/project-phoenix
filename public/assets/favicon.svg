<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SV lifecycle monogram">
  <rect width="128" height="128" rx="26" fill="#0D1B2A"/>

  <!-- Four-segment lifecycle ring -->
  <path d="M18 60 A46 46 0 0 1 60 18" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M68 18 A46 46 0 0 1 110 60" fill="none" stroke="#2563EB" stroke-width="6"/>
  <path d="M110 68 A46 46 0 0 1 68 110" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M60 110 A46 46 0 0 1 18 68" fill="none" stroke="#2563EB" stroke-width="6"/>

  <!-- Geometric S: one continuous technical stroke -->
  <path d="M84 37 H48 L38 47 V56 L47 65 H67 L78 76 V86 L68 96 H37"
        fill="none" stroke="#FFFFFF" stroke-width="12"
        stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Angular V: validation / verification / visibility -->
  <path d="M63 67 L84 101 L108 60"
        fill="none" stroke="#2563EB" stroke-width="13"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>