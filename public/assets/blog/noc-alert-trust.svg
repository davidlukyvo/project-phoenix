<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Alert noise làm giảm trust</title><desc id="d">Minh họa mối quan hệ giữa alert noise, actionability và niềm tin của người vận hành.</desc><rect width="1200" height="620" fill="#f8fafc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Alert nhiều không đồng nghĩa Observability tốt</text><g font-family="Arial,sans-serif"><rect x="70" y="145" width="470" height="350" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="305" y="200" text-anchor="middle" font-size="24" font-weight="800" fill="#b42318">ALERT NOISE</text><g font-size="18"><rect x="115" y="240" width="380" height="48" rx="12" fill="#fdecec"/><text x="135" y="271" fill="#7a271a">Warning không cần hành động</text><rect x="115" y="305" width="380" height="48" rx="12" fill="#fff1e8"/><text x="135" y="336" fill="#8a3b12">Retry và status lặp lại</text><rect x="115" y="370" width="380" height="48" rx="12" fill="#fdecec"/><text x="135" y="401" fill="#7a271a">False positive kéo dài</text></g><circle cx="600" cy="320" r="50" fill="#183b66"/><text x="600" y="337" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">→</text><rect x="660" y="145" width="470" height="350" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="895" y="200" text-anchor="middle" font-size="24" font-weight="800" fill="#2f6b46">ACTIONABLE SIGNAL</text><g font-size="18" fill="#39465e"><circle cx="710" cy="265" r="9" fill="#2f8b57"/><text x="735" y="272">Severity đúng với impact</text><circle cx="710" cy="325" r="9" fill="#2f8b57"/><text x="735" y="332">Persistence đủ để loại noise</text><circle cx="710" cy="385" r="9" fill="#2f8b57"/><text x="735" y="392">Recovery message rõ ràng</text><circle cx="710" cy="445" r="9" fill="#2f8b57"/><text x="735" y="452">Người nhận biết phải làm gì</text></g><text x="600" y="565" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Alert quality tạo trust. Alert volume thì không.</text></g></svg>