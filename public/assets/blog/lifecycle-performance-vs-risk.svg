<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f7f9fc"/><text x="70" y="88" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Performance Capacity ≠ Lifecycle Risk</text><text x="70" y="130" font-family="Arial,sans-serif" font-size="20" fill="#667085">Một hệ thống có thể còn dư tài nguyên nhưng rủi ro vận hành vẫn tăng theo thời gian.</text><rect x="70" y="180" width="480" height="340" rx="24" fill="#eef7f1" stroke="#b9d9c3"/><text x="110" y="235" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176b3a">PERFORMANCE CAPACITY</text><text x="110" y="285" font-family="Arial,sans-serif" font-size="21" fill="#172033">CPU</text><rect x="220" y="265" width="260" height="22" rx="11" fill="#d8e2ea"/><rect x="220" y="265" width="52" height="22" rx="11" fill="#4d8b69"/><text x="495" y="283" font-family="Arial,sans-serif" font-size="18" fill="#172033">Low</text><text x="110" y="345" font-family="Arial,sans-serif" font-size="21" fill="#172033">RAM</text><rect x="220" y="325" width="260" height="22" rx="11" fill="#d8e2ea"/><rect x="220" y="325" width="78" height="22" rx="11" fill="#4d8b69"/><text x="495" y="343" font-family="Arial,sans-serif" font-size="18" fill="#172033">Low</text><text x="110" y="405" font-family="Arial,sans-serif" font-size="21" fill="#172033">Traffic</text><rect x="220" y="385" width="260" height="22" rx="11" fill="#d8e2ea"/><rect x="220" y="385" width="92" height="22" rx="11" fill="#4d8b69"/><text x="495" y="403" font-family="Arial,sans-serif" font-size="18" fill="#172033">Low</text><text x="110" y="470" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#176b3a">Workload hiện tại: còn dư</text><rect x="650" y="180" width="480" height="340" rx="24" fill="#fff5ef" stroke="#ecc6ad"/><text x="690" y="235" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#9b451b">LIFECYCLE RISK</text><g font-family="Arial,sans-serif" font-size="21" fill="#172033"><text x="710" y="300">• EOS / EOL</text><text x="710" y="350">• Security support giảm</text><text x="710" y="400">• Hardware failure risk tăng</text><text x="710" y="450">• Spare parts khó tìm</text><text x="710" y="500">• Recovery time khó dự đoán</text></g><path d="M580 350h40" stroke="#667085" stroke-width="4"/><path d="M610 338l14 12-14 12" fill="none" stroke="#667085" stroke-width="4"/><text x="70" y="585" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b66">“Còn chạy được” và “còn đáng để tin cậy” là hai câu hỏi khác nhau.</text></svg>