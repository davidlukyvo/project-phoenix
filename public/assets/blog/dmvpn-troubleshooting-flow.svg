<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:34px;font-weight:800}.h{font-size:22px;font-weight:700}.s{font-size:18px}.sm{font-size:16px;fill:#5b6677}.box{fill:#fff;stroke:#d9e2ec;stroke-width:2}.line{stroke:#245ea8;stroke-width:5;fill:none}</style><rect width="1200" height="675" fill="#f8fafc"/><text x="60" y="70" class="t">Troubleshooting DMVPN: đi từ dưới lên, không đoán</text><text x="60" y="108" class="sm">Mỗi bước trả lời một câu hỏi trước khi chuyển sang bước kế tiếp.</text><rect x="80" y="210" width="180" height="150" rx="20" class="box"/><text x="170" y="255" text-anchor="middle" class="h">1. UNDERLAY</text><text x="170" y="300" text-anchor="middle" class="sm">Link / ISP</text><text x="170" y="330" text-anchor="middle" class="sm">Reachability</text><rect x="300" y="210" width="180" height="150" rx="20" class="box"/><text x="390" y="255" text-anchor="middle" class="h">2. IPsec</text><text x="390" y="300" text-anchor="middle" class="sm">IKE / SA</text><text x="390" y="330" text-anchor="middle" class="sm">NHRP / tunnel</text><rect x="520" y="210" width="180" height="150" rx="20" class="box"/><text x="610" y="255" text-anchor="middle" class="h">3. OSPF</text><text x="610" y="300" text-anchor="middle" class="sm">Neighbor</text><text x="610" y="330" text-anchor="middle" class="sm">Route table</text><rect x="740" y="210" width="180" height="150" rx="20" class="box"/><text x="830" y="255" text-anchor="middle" class="h">4. PATH</text><text x="830" y="300" text-anchor="middle" class="sm">Forward</text><text x="830" y="330" text-anchor="middle" class="sm">Return</text><rect x="960" y="210" width="180" height="150" rx="20" class="box"/><text x="1050" y="255" text-anchor="middle" class="h">5. SERVICE</text><text x="1050" y="300" text-anchor="middle" class="sm">Login / API</text><text x="1050" y="330" text-anchor="middle" class="sm">Business flow</text><path d="M260 285H300 M480 285H520 M700 285H740 M920 285H960" class="line"/><text x="600" y="470" text-anchor="middle" class="h">Một tunnel có thể UP trong khi OSPF sai. OSPF có thể đúng trong khi return path sai.</text><text x="600" y="515" text-anchor="middle" class="sm">Đó là lý do symptom ở application không nên được xử lý bằng cách đổi config ngẫu nhiên ở router.</text><text x="600" y="610" text-anchor="middle" class="s" font-weight="700">Quan sát → Khoanh vùng → Chứng minh → Thay đổi có kiểm soát → Validate</text></svg>