<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Failure behavior của High Availability</title><desc id="d">Normal state dẫn tới failure, detection, role transition và service validation.</desc><rect width="1200" height="520" fill="#f8fafc"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">High Availability phải được nhìn như một chuỗi hành vi</text><g font-family="Arial,sans-serif"><g transform="translate(75 165)"><circle cx="70" cy="70" r="55" fill="#e6f4ea"/><text x="70" y="66" text-anchor="middle" font-size="31" font-weight="800" fill="#2f6b46">01</text><text x="70" y="145" text-anchor="middle" font-size="19" font-weight="800" fill="#172033">NORMAL</text><text x="70" y="172" text-anchor="middle" font-size="15" fill="#667085">Active phục vụ traffic</text></g><g transform="translate(295 165)"><circle cx="70" cy="70" r="55" fill="#fdecec"/><text x="70" y="66" text-anchor="middle" font-size="31" font-weight="800" fill="#b42318">02</text><text x="70" y="145" text-anchor="middle" font-size="19" font-weight="800" fill="#172033">FAILURE</text><text x="70" y="172" text-anchor="middle" font-size="15" fill="#667085">Node hoặc path biến mất</text></g><g transform="translate(515 165)"><circle cx="70" cy="70" r="55" fill="#fff1e8"/><text x="70" y="66" text-anchor="middle" font-size="31" font-weight="800" fill="#d35400">03</text><text x="70" y="145" text-anchor="middle" font-size="19" font-weight="800" fill="#172033">DETECT</text><text x="70" y="172" text-anchor="middle" font-size="15" fill="#667085">Heartbeat, monitor, health</text></g><g transform="translate(735 165)"><circle cx="70" cy="70" r="55" fill="#e8f1ff"/><text x="70" y="66" text-anchor="middle" font-size="31" font-weight="800" fill="#2f6bd1">04</text><text x="70" y="145" text-anchor="middle" font-size="19" font-weight="800" fill="#172033">TRANSITION</text><text x="70" y="172" text-anchor="middle" font-size="15" fill="#667085">Standby nhận vai trò</text></g><g transform="translate(955 165)"><circle cx="70" cy="70" r="55" fill="#f0eaff"/><text x="70" y="66" text-anchor="middle" font-size="31" font-weight="800" fill="#6941c6">05</text><text x="70" y="145" text-anchor="middle" font-size="19" font-weight="800" fill="#172033">VALIDATE</text><text x="70" y="172" text-anchor="middle" font-size="15" fill="#667085">Service thật sự usable</text></g><g stroke="#9aa8ba" stroke-width="5" stroke-linecap="round"><path d="M215 235h80"/><path d="M435 235h80"/><path d="M655 235h80"/><path d="M875 235h80"/></g><text x="600" y="455" text-anchor="middle" font-size="22" font-weight="700" fill="#183b66">Nếu chỉ kiểm tra bước 04, chúng ta mới biết role đã đổi — chưa biết business service đã sống lại.</text></g></svg>