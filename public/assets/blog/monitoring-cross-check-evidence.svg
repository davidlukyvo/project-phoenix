<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f7f9fc"/><text x="55" y="65" font-family="Arial" font-size="28" font-weight="700" fill="#172b4d">SINGLE SIGNAL vs CROSS-CHECK EVIDENCE</text><rect x="55" y="120" width="430" height="340" rx="22" fill="#fff7f5" stroke="#f1c5bd"/><text x="270" y="175" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#d94c3d">SINGLE SIGNAL — RỦI RO CAO</text><rect x="145" y="225" width="250" height="120" rx="16" fill="#fff" stroke="#d94c3d" stroke-width="3"/><text x="270" y="270" text-anchor="middle" font-family="Arial" font-size="19" fill="#5b6b82">Monitoring Sensor</text><text x="270" y="315" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#d94c3d">UNKNOWN</text><text x="270" y="410" text-anchor="middle" font-family="Arial" font-size="20" fill="#26384f">Chưa đủ evidence để kết luận downtime.</text><rect x="535" y="120" width="610" height="340" rx="22" fill="#f4fbf7" stroke="#b7dfc7"/><text x="840" y="175" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#23824f">CROSS-CHECK — CONFIDENCE CAO</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#b7dfc7"><rect x="575" y="225" width="120" height="110" rx="14"/><rect x="715" y="225" width="120" height="110" rx="14"/><rect x="855" y="225" width="120" height="110" rx="14"/><rect x="995" y="225" width="120" height="110" rx="14"/></g><g font-size="17" font-weight="700" fill="#17365d"><text x="635" y="270">Firewall Log</text><text x="775" y="270">Switch Log</text><text x="915" y="270">ISP Status</text><text x="1055" y="270">App / User</text></g><g font-size="34" fill="#32a66a"><text x="635" y="320">✓</text><text x="775" y="320">✓</text><text x="915" y="320">✓</text><text x="1055" y="320">✓</text></g></g><text x="840" y="410" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#23824f">Nhiều nguồn độc lập cùng chỉ về một kết luận → confidence tăng lên.</text><text x="600" y="520" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#172b4d">Monitoring data là evidence. Nó không phải truth tuyệt đối.</text></svg>