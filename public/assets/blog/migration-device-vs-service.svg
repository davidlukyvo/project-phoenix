<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Device Validation khác Service Validation</title><desc id="d">So sánh kiểm tra thiết bị với kiểm tra dịch vụ thực tế.</desc><rect width="1200" height="560" rx="28" fill="#f7f9fc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Device Validation ≠ Service Validation</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="19" fill="#667085">Thiết bị hoạt động đúng thiết kế chưa chắc dịch vụ đã hoạt động đúng cho người dùng.</text><rect x="65" y="165" width="470" height="300" rx="20" fill="#fff" stroke="#cbdcf4"/><rect x="665" y="165" width="470" height="300" rx="20" fill="#fff" stroke="#bfe4cc"/><text x="300" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#1f5faa">Device Validation</text><text x="900" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#23804a">Service Validation</text><g font-family="Arial,sans-serif" font-size="18" fill="#344054"><text x="115" y="265">✓ Interface up/down</text><text x="115" y="307">✓ Routing table OK</text><text x="115" y="349">✓ Policy hit / session up</text><text x="115" y="391">✓ Log không có lỗi</text><text x="115" y="433">✓ Throughput đạt kỳ vọng</text><text x="715" y="265">✓ User thật kết nối được</text><text x="715" y="307">✓ Ứng dụng hoạt động đúng</text><text x="715" y="349">✓ Hiệu năng chấp nhận được</text><text x="715" y="391">✓ Không lỗi gián đoạn ngẫu nhiên</text><text x="715" y="433">✓ Luồng đặc thù như Pre-logon hoạt động</text></g><text x="600" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="64" font-weight="800" fill="#172033">≠</text><rect x="175" y="485" width="850" height="48" rx="12" fill="#fff7e6" stroke="#f2d49b"/><text x="600" y="516" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8a5a00">Thiết bị có thể PASS tất cả test kỹ thuật, nhưng dịch vụ vẫn FAIL khi người dùng thật sự sử dụng.</text></svg>