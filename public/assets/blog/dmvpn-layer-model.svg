<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:34px;font-weight:800}.h{font-size:22px;font-weight:700}.s{font-size:18px}.sm{font-size:16px;fill:#5b6677}</style><rect width="1200" height="675" fill="#f7f9fc"/><text x="60" y="70" class="t">Một kết nối WAN có nhiều lớp hơn một đường truyền</text><text x="60" y="108" class="sm">Khi troubleshoot, phải biết mình đang đứng ở lớp nào.</text><rect x="170" y="150" width="860" height="64" rx="18" fill="#fff7eb" stroke="#d9e2ec"/><text x="220" y="190" class="h">BUSINESS SERVICE</text><text x="620" y="190" class="s">Application, authentication, file, ERP, collaboration...</text><rect x="170" y="240" width="860" height="64" rx="18" fill="#f4f0ff" stroke="#d9e2ec"/><text x="220" y="280" class="h">REACHABILITY</text><text x="620" y="280" class="s">Route đúng, next-hop đúng, return path đúng</text><rect x="170" y="330" width="860" height="64" rx="18" fill="#edf7f1" stroke="#d9e2ec"/><text x="220" y="370" class="h">ROUTING</text><text x="620" y="370" class="s">OSPF adjacency, learned routes, redistribution</text><rect x="170" y="420" width="860" height="64" rx="18" fill="#eef5ff" stroke="#d9e2ec"/><text x="220" y="460" class="h">OVERLAY</text><text x="620" y="460" class="s">DMVPN / IPsec tunnel và tunnel state</text><rect x="170" y="510" width="860" height="64" rx="18" fill="#f5f6f8" stroke="#d9e2ec"/><text x="220" y="550" class="h">UNDERLAY</text><text x="620" y="550" class="s">ISP circuit, physical link, carrier reachability</text><text x="600" y="635" text-anchor="middle" class="s" font-weight="700">Tunnel UP mới chỉ chứng minh một lớp. User làm việc được mới là kết quả cuối.</text></svg>