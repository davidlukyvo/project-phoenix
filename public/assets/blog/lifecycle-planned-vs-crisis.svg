<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f7f9fc"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Planned Replacement vs. Crisis Replacement</text><text x="70" y="122" font-family="Arial,sans-serif" font-size="20" fill="#667085">Khác biệt lớn nhất không nằm ở thiết bị mới — mà ở quyền kiểm soát thời điểm và rủi ro.</text><rect x="70" y="180" width="500" height="320" rx="22" fill="#eef7f1" stroke="#b9d9c3"/><text x="110" y="235" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176b3a">PLANNED</text><g font-family="Arial,sans-serif" font-size="21" fill="#172033"><text x="110" y="300">Assess</text><text x="210" y="300">→</text><text x="250" y="300">Budget</text><text x="360" y="300">→</text><text x="400" y="300">Test</text><text x="470" y="300">→</text><text x="110" y="355">Change Window → Validate → Rollback ready</text><text x="110" y="430" font-weight="700" fill="#176b3a">Chủ động về thời gian và phương án</text></g><rect x="630" y="180" width="500" height="320" rx="22" fill="#fff0ed" stroke="#e5b9b2"/><text x="670" y="235" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#a23b2a">CRISIS</text><g font-family="Arial,sans-serif" font-size="21" fill="#172033"><text x="670" y="300">Failure → Diagnose → Find spare</text><text x="670" y="355">→ Emergency change → Recover</text><text x="670" y="430" font-weight="700" fill="#a23b2a">Ít lựa chọn hơn, áp lực cao hơn</text></g><text x="70" y="565" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183b66">Quản trị lifecycle tốt là mua lại quyền được lựa chọn trước khi failure lấy quyền đó đi.</text></svg>