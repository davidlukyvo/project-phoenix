<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="t d"><title id="t">DMVPN multi-site topology</title><desc id="d">Head Office Bình Dương làm Hub, kết nối DMVPN dual WAN đến Hà Nam, Chu Lai và Hậu Giang.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:20px;font-weight:800}.m{font-size:16px;font-weight:700}.s{font-size:14px}.xs{font-size:12px;fill:#566273}.box{fill:#fff;stroke:#cfd8e3;stroke-width:1.6}.hub{fill:#f7fbff;stroke:#6e9bd2;stroke-width:1.8}.hn{fill:#f8fff9;stroke:#69a86f;stroke-width:1.8}.cl{fill:#f8fbff;stroke:#6e9bd2;stroke-width:1.8}.hg{fill:#fffaf6;stroke:#e08a45;stroke-width:1.8}.cloud{fill:#f7f9fc;stroke:#9aa9bb;stroke-width:1.5}.blue{stroke:#3478c7;stroke-width:2.4;fill:none}.green{stroke:#55a66a;stroke-width:2.4;fill:none}.orange{stroke:#ed7d31;stroke-width:2.2;fill:none;stroke-dasharray:8 6}.gray{stroke:#4e5968;stroke-width:1.8;fill:none;stroke-dasharray:7 6}.dark{fill:#25496f}.fw{fill:#273746}.srv{fill:#34495e}.lan{stroke:#263746;stroke-width:2.5}</style><rect width="1400" height="620" fill="#fff"/><rect x="28" y="28" width="230" height="175" rx="8" class="box"/><text x="143" y="58" text-anchor="middle" class="m">CHÚ THÍCH</text><line x1="52" y1="86" x2="92" y2="86" class="blue"/><text x="106" y="91" class="s">Internet / WAN01</text><line x1="52" y1="113" x2="92" y2="113" class="green"/><text x="106" y="118" class="s">Internet / WAN02</text><line x1="52" y1="140" x2="92" y2="140" class="orange"/><text x="106" y="145" class="s">DMVPN Overlay (IPsec)</text><line x1="52" y1="167" x2="92" y2="167" class="gray"/><text x="106" y="172" class="s">OSPF Adjacency</text><rect x="395" y="18" width="610" height="190" rx="8" class="hub"/><text x="700" y="47" text-anchor="middle" class="h" fill="#234f87">HEAD OFFICE – BÌNH DƯƠNG (HUB)</text><g transform="translate(455 76)"><rect width="76" height="42" rx="5" class="fw"/><path d="M12 12h52M12 22h52M12 32h52" stroke="#fff" stroke-width="2"/><rect y