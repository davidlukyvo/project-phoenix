<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">DMVPN multi-site topology</title><desc id="desc">Head Office Bình Dương làm Hub, dual WAN qua hai ISP, DMVPN IPsec và OSPF Area 0 kết nối Hà Nam, Chu Lai và Hậu Giang.</desc><defs><style><![CDATA[text{font-family:Arial,Helvetica,sans-serif;fill:#0c1b2d}.title{font-size:27px;font-weight:800}.head{font-size:22px;font-weight:800}.body{font-size:17px}.small{font-size:15px}.tiny{font-size:13px}.blueText{fill:#143c9e}.greenText{fill:#16752c}.orangeText{fill:#f04b13}.panel{fill:#fff;stroke:#476b91;stroke-width:1.6}.hub{fill:#fff;stroke:#244bc4;stroke-width:2}.siteG{fill:#fff;stroke:#16933c;stroke-width:2}.siteB{fill:#fff;stroke:#244bc4;stroke-width:2}.siteO{fill:#fff;stroke:#ff5b22;stroke-width:2}.blue{fill:none;stroke:#164fd2;stroke-width:2.5}.green{fill:none;stroke:#158333;stroke-width:2.5}.orange{fill:none;stroke:#ff5a1f;stroke-width:2.5;stroke-dasharray:10 8}.brown{fill:none;stroke:#7b291c;stroke-width:2.3;stroke-dasharray:9 8}.black{fill:none;stroke:#111827;stroke-width:2.2}.grayDash{fill:none;stroke:#172033;stroke-width:2.2;stroke-dasharray:9 7}.navy{fill:#0c2340}.soft{fill:#f7f9fc}]]></style></defs><rect width="1536" height="1024" fill="#fff"/><rect x="36" y="28" width="285" height="267" rx="8" class="panel"/><text x="179" y="64" text-anchor="middle" class="head">CHÚ THÍCH</text><line x1="62" y1="96" x2="112" y2="96" class="blue"/><text x="132" y="102" class="body">Internet / WAN01 (Primary)</text><line x1="62" y1="133" x2="112" y2="133" class="green"/><text x="132" y="139" class="body">Internet / WAN02 (Backup)</text><line x1="62" y1="170" x2="112" y2="170" class="orange"/><text x="132" y="176" class="body">DMVPN Overlay (IPsec)</text><line x1="62" y1="207" x2="112" y2="207" class="brown"/><text x="132" y="213" class="body">OSPF Adjacency</text><line x1="62" y1="244" x2="112" y2="244" class="black"/><text x="132" y="250" class="body">Internal Network</text><rect x="382" y="23" width="692" height="302" rx="8" class="hub"/><text x="728" y="63" text-anchor="middle" class="title blueText">HEAD OFFICE – BÌNH DƯƠNG (HUB)</text><text x="506" y="110" text-anchor="middle" class="body" font-weight="700">FW Cluster (HA)</text><g transform="translate(430 132)"><rect width="58" height="47" rx="5" class="navy"/><rect x="95" width="58" height="47" rx="5" class="navy"/><rect y="73" width="58" height="47" rx="5" class="navy"/><rect x="95" y="73" width="58" height="47" rx="5" class="navy"/><g stroke="#fff" stroke-width="2"><path d="M12 13h34M12 23h34M12 33h34M107 13h34M107 23h34M107 33h34M12 86h34M12 96h34M12 106h34M107 86h34M107 96h34M107 106h34"/></g><path d="M58 23h37M58 96h37M29 47v73M124 47v73" class="green"/></g><text x="731" y="110" text-anchor="middle" class="body" font-weight="700">Core Switch / L3</text><g transform="translate(676 136)"><ellipse cx="55" cy="22" rx="55" ry="22" class="navy"/><rect y="22" width="110" height="34" class="navy"/><ellipse cx="55" cy="56" rx="55" ry="22" class="navy"/><path d="M25 36h60M38 23l-13 13 13 13M72 23l13 13-13 13" stroke="#fff" stroke-width="3" fill="none"/></g><text x="954" y="104" text-anchor="middle" class="body" font-weight="700">Datacenter /</text><text x="954" y="127" text-anchor="middle" class="body" font-weight="700">Server Farm</text><g transform="translate(910 142)" class="navy"><rect width="90" height="42" rx="4"/><rect y="50" width="90" height="42" rx="4"/><rect y="100" width="90" height="42" rx="4"/></g><g fill="#fff"><circle cx="985" cy="163" r="3"/><circle cx="985" cy="213" r="3"/><circle cx="985" cy="263" r="3"/></g><path d="M583 180H672" class="grayDash"/><path d="M787 180H906" class="grayDash"/><line x1="638" y1="285" x2="824" y2="285" class="black"/><line x1="670" y1="285" x2="670" y2="310" class="black"/><line x1="792" y1="285" x2="792" y2="310" class="black"/><text x="731" y="306" text-anchor="middle" class="small">Internal Network</text><rect x="617" y="31