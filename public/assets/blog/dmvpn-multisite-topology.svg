<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="t d"><title id="t">DMVPN multi-site topology</title><desc id="d">Head Office Bình Dương làm Hub kết nối dual WAN và DMVPN tới Hà Nam, Chu Lai, Hậu Giang.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:20px;font-weight:800}.m{font-size:16px;font-weight:700}.s{font-size:14px}.xs{font-size:12px;fill:#566273}.box{fill:#fff;stroke:#cfd8e3;stroke-width:1.6}.hub{fill:#f7fbff;stroke:#6e9bd2;stroke-width:1.8}.site{fill:#fff;stroke:#cfd8e3;stroke-width:1.8}.blue{stroke:#3478c7;stroke-width:3;fill:none}.green{stroke:#55a66a;stroke-width:3;fill:none}.orange{stroke:#ed7d31;stroke-width:2.5;fill:none;stroke-dasharray:9 7}.gray{stroke:#5c6675;stroke-width:2;fill:none;stroke-dasharray:7 6}.fw{fill:#273746}.dark{fill:#25496f}</style><rect width="1400" height="700" fill="#fff"/><rect x="25" y="25" width="245" height="175" rx="10" class="box"/><text x="148" y="55" text-anchor="middle" class="m">CHÚ THÍCH</text><line x1="50" y1="86" x2="95" y2="86" class="blue"/><text x="110" y="91" class="s">WAN01 / Primary</text><line x1="50" y1="116" x2="95" y2="116" class="green"/><text x="110" y="121" class="s">WAN02 / Backup</text><line x1="50" y1="146" x2="95" y2="146" class="orange"/><text x="110" y="151" class="s">DMVPN / IPsec</text><line x1="50" y1="176" x2="95" y2="176" class="gray"/><text x="110" y="181" class="s">OSPF adjacency</text><rect x="395" y="20" width="610" height="185" rx="10" class="hub"/><text x="700" y="50" text-anchor="middle" class="h">HEAD OFFICE – BÌNH DƯƠNG (HUB)</text><g transform="translate(455 75)"><rect width="72" height="38" rx="5" class="fw"/><path d="M12 11h48M12 20h48M12 29h48" stroke="#fff" stroke-width="2"/><rect y="49" width="72" height="38" rx="5" class="fw"/><path d="M12 60h48M12 69h48M12 78h48" stroke="#fff" stroke-width="2"/><text x="36" y="112" text-anchor="middle" class="xs">FW Cluster (HA)</text></g><g transform="translate(650 83)"><ellipse cx="50" cy="18" rx="50" ry="18" class="dark"/><rect y="18" width="100" height="28" class="dark"/><ellipse cx="50" cy="46" rx="50" ry="18" class="dark"/><text x="50" y="86" text-anchor="middle" class="xs">Core / L3</text></g><g transform="translate(860 72)"><rect width="76" height="95" rx="6" fill="#34495e"/><rect x="10" y="12" width="56" height="17" rx="3" fill="#fff"/><rect x="10" y="39" width="56" height="17" rx="3" fill="#fff"/><rect x="10" y="66" width="56" height="17" rx="3" fill="#fff"/><text x="38" y="116" text-anchor="middle" class="xs">Datacenter / Server Farm</text></g><path d="M530 113H645" class="gray"/><path d="M755 113H855" class="gray"/><rect x="575" y="165" width="250" height="30" rx="6" fill="#fff" stroke="#8eb0d8"/><text x="700" y="186" text-anchor="middle" class="m">OSPF Area 0</text><rect x="1110" y="25" width="260" height="175" rx="10" class="box"/><text x="1240" y="55" text-anchor="middle" class="m">DMVPN OVERLAY</text><text x="1130" y="87" class="s">• Hub: Bình Dương</text><text x="1130" y="116" class="s">• Spoke: Hà Nam / Chu Lai / Hậu Giang</text><text x="1130" y="145" class="s">• Dynamic Tunnel (NHRP)</text><text x="1130" y="174" class="s">• OSPF over DMVPN</text><g transform="translate(310 235)"><path d="M20 42c0-18 16-31 34-28 8-17 35-20 47-4 19-6 39 7 39 27 17 1 29 13 29 28 0 17-14 30-32 30H35C15 95 0 82 0 65c0-11 7-20 20-23z" fill="#f7f9fc" stroke="#9aa9bb" stroke-width="1.5"/><text x="84" y="53" text-anchor="middle" class="m">ISP #1</text><text x="84" y="75" text-anchor="middle" class="xs">WAN01 / Primary</text></g><g transform="translate(920 235)"><path d="M20 42c0-18 16-31 34-28 8-17 35-20 47-4 19-6 39 7 39 27 17 1 29 13 29 28 0 17-14 30-32 30H35C15 95 0 82 0 65c0-11 7-20 20-23z" fill="#f7f9fc" stroke="#9aa9bb" stroke-width="1.5"/><text x="84" y="53" text-anchor="middle" class="m">ISP #2</text><text x="84" y="75" text-anchor="middle" class="xs">WAN02 / Backup</text></g><g transform="translate(570 235)"><path d="M25 48c0-22 19-39 42-35 10-22 43-25 59-5 24-7 48 9 48 33 21 1 36 16 36 35 0 21-18 37-40 37H43C18 113 0 97 0 76c0-13 9-25 25-28z" fill="#f7f9fc" stroke="#9aa9bb" stroke-width="1.5"/><text x="105" y="62" text-anchor="middle" class="m">DMVPN OVERLAY</text><text x="105" y="87" text-anchor="middle" class="s">IPsec • NHRP • OSPF</text></g><path d="M535 205 C500 220 455 238 430 260" class="blue"/><path d="M865 205 C900 220 945 238 970 260" class="green"/><path d="M700 205V248" class="orange"/><path d="M700 205V248" class="gray"/><rect x="70" y="465" width="360" height="190" rx="10" class="site" stroke="#69a86f"/><rect x="520" y="465" width="360" height="190" rx="10" class="site" stroke="#6e9bd2"/><rect x="970" y="465" width="360" height="190" rx="10" class="site" stroke="#e08a45"/><text x="250" y="497" text-anchor="middle" class="h">SITE – HÀ NAM (SPOKE)</text><text x="700" y="497" text-anchor="middle" class="h">SITE – CHU LAI (SPOKE)</text><text x="1150" y="497" text-anchor="middle" class="h">SITE – HẬU GIANG (SPOKE)</text><g id="spoke"><rect x="190" y="520" width="52" height="29" rx="4" class="fw"/><rect x="250" y="520" width="52" height="29" rx="4" class="fw"/><text x="246" y="568" text-anchor="middle" class="xs">FGT Cluster (HA)</text><ellipse cx="246" cy="596" rx="34" ry="12" class="dark"/><rect x="212" y="596" width="68" height="17" class="dark"/><ellipse cx="246" cy="613" rx="34" ry="12" class="dark"/><text x="246" y="642" text-anchor="middle" class="xs">WAN Router / Edge</text></g><use href="#spoke" transform="translate(450 0)"/><use href="#spoke" transform="translate(900 0)"/><path d="M394 330 C330 365 280 405 250 465" class="blue"/><path d="M1004 330 C1065 365 1120 405 1150 465" class="green"/><path d="M394 330 C500 355 610 390 700 465" class="blue"/><path d="M1004 330 C900 355 790 390 700 465" class="green"/><path d="M394 330 C620 345 930 385 1150 465" class="blue"/><path d="M1004 330 C780 345 470 385 250 465" class="green"/><path d="M635 348 C520 385 360 420 250 465" class="orange"/><path d="M675 350 L700 465" class="orange"/><path d="M745 348 C860 385 1020 420 1150 465" class="orange"/><path d="M625 360 C510 400 350 435 250 465" class="gray"/><path d="M700 360V465" class="gray"/><path d="M755 360 C870 400 1030 435 1150 465" class="gray"/><text x="700" y="688" text-anchor="middle" class="s" font-weight="700">Dual WAN là underlay. DMVPN là overlay. OSPF giữ routing sống khi một path thay đổi.</text></svg>