<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Từ kiến thức cá nhân đến năng lực tổ chức</title><desc id="d">Runbook, ownership, testing và evidence biến kinh nghiệm của một engineer thành khả năng phục hồi có thể lặp lại.</desc><rect width="1200" height="560" fill="#f8fafc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Khi Recovery chỉ nằm trong trí nhớ của một người</text><g font-family="Arial,sans-serif"><rect x="65" y="145" width="410" height="305" rx="24" fill="#fff" stroke="#dfe5ec"/><circle cx="180" cy="255" r="60" fill="#e8f1ff"/><text x="180" y="270" text-anchor="middle" font-size="52">👤</text><text x="285" y="215" font-size="24" font-weight="800" fill="#172033">Engineer biết cách Restore</text><text x="285" y="258" font-size="18" fill="#667085">• Nhớ dependency</text><text x="285" y="292" font-size="18" fill="#667085">• Nhớ thứ tự thao tác</text><text x="285" y="326" font-size="18" fill="#667085">• Biết workaround</text><text x="270" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#b42318">Knowledge concentration = risk</text><circle cx="600" cy="300" r="48" fill="#183b66"/><text x="600" y="315" text-anchor="middle" font-size="48" font-weight="800" fill="#fff">→</text><rect x="725" y="125" width="410" height="345" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="930" y="185" text-anchor="middle" font-size="24" font-weight="800" fill="#172033">Organizational Capability</text><g font-size="19" fill="#39465e"><circle cx="790" cy="245" r="9" fill="#2f6bd1"/><text x="820" y="252">Runbook rõ ràng</text><circle cx="790" cy="300" r="9" fill="#2f6bd1"/><text x="820" y="307">Ownership được xác định</text><circle cx="790" cy="355" r="9" fill="#2f6bd1"/><text x="820" y="362">Restore / DR test định kỳ</text><circle cx="790" cy="410" r="9" fill="#2f6bd1"/><text x="820" y="417">Evidence &amp; lessons learned</text></g><text x="930" y="455" text-anchor="middle" font-size="20" font-weight="700" fill="#2f8b57">Capability có thể lặp lại</text><text x="600" y="525" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">Governance không thay thế Engineering — nó giúp Engineering tồn tại ngoài trí nhớ cá nhân.</text></g></svg>