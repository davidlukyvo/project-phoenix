<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="t d"><title id="t">Migration là một hành trình</title><desc id="d">Bảy bước từ dependency discovery đến post-change observation.</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#1e3a5f" flood-opacity=".10"/></filter></defs><rect width="1400" height="620" rx="28" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#152033"><text x="60" y="72" font-size="34" font-weight="800">Migration là một hành trình, không phải một sự kiện</text><text x="60" y="112" font-size="19" fill="#667085">Phần việc quan trọng nhất thường xảy ra trước maintenance window.</text></g><g filter="url(#s)"><rect x="50" y="165" width="165" height="275" rx="18" fill="#fff" stroke="#cbdcf4"/><rect x="235" y="165" width="165" height="275" rx="18" fill="#fff" stroke="#bfe4cc"/><rect x="420" y="165" width="165" height="275" rx="18" fill="#fff" stroke="#f2d49b"/><rect x="605" y="165" width="165" height="275" rx="18" fill="#fff" stroke="#d9c9ef"/><rect x="790" y="165" width="165" height="275" rx="18" fill="#fff" stroke="#efc0b8"/><rect x="975" y="165" width="165" height="275" rx="18" fill="#fff" stroke="#bfe4cc"/><rect x="1160" y="165" width="190" height="275" rx="18" fill="#fff" stroke="#cbdcf4"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g font-size="18" font-weight="800" fill="#173b65"><text x="132" y="215">1. Dependency</text><text x="132" y="239">Discovery</text><text x="317" y="215">2. FDD</text><text x="317" y="239">&amp; Design</text><text x="502" y="215">3. Build &amp; UAT</text><text x="502" y="239">Pre-Validation</text><text x="687" y="215">4. Rollback</text><text x="687" y="239">Strategy</text><text x="872" y="215">5. Cutover</text><text x="872" y="239">Change Window</text><text x="1057" y="215">6. Service</text><text x="1057" y="239">Validation</text><text x="1255" y="215">7. Post-change</text><text x="1255" y="239">Observation</text></g><g font-size="15" fill="#475467"><text x="132" y="290">Hiểu hệ thống</text><text x="132" y="316">Dependency</text><text x="132" y="342">Impact</text><text x="317" y="290">Architecture</text><text x="317" y="316">Assumptions</text><text x="317" y="342">Success criteria</text><text x="502" y="290">Lab / UAT</text><text x="502" y="316">Test case</text><text x="502" y="342">Evidence</text><text x="687" y="290">Trigger</text><text x="687" y="316">Procedure</text><text x="687" y="342">Communication</text><text x="872" y="290">Runbook</text><text x="872" y="316">Checkpoint</text><text x="872" y="342">Controlled change</text><text x="1057" y="290">Service thật</text><text x="1057" y="316">Người dùng thật</text><text x="1057" y="342">End-to-end</text><text x="1255" y="290">Monitor</text><text x="1255" y="316">Tune</text><text x="1255" y="342">Lessons learned</text></g></g><g stroke="#75849a" stroke-width="3" fill="none"><path d="M215 302h20"/><path d="M400 302h20"/><path d="M585 302h20"/><path d="M770 302h20"/><path d="M955 302h20"/><path d="M1140 302h20"/></g><g fill="#75849a"><path d="M230 296l10 6-10 6z"/><path d="M415 296l10 6-10 6z"/><path d="M600 296l10 6-10 6z"/><path d="M785 296l10 6-10 6z"/><path d="M970 296l10 6-10 6z"/><path d="M1155 296l10 6-10 6z"/></g><line x1="105" y1="488" x2="1290" y2="488" stroke="#2f6db5" stroke-width="2" stroke-dasharray="9 7"/><text x="700" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#2f6db5">Communication &amp; Stakeholder Alignment xuyên suốt</text><text x="700" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#172033">Cutover chỉ là một thời điểm. Migration là cả một quá trình.</text></svg>