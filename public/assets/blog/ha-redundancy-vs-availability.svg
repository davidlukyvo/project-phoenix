<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Redundancy không đồng nghĩa High Availability</title><desc id="d">Hai node chỉ tạo redundancy. High Availability phải được chứng minh bằng failover và service validation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#fff8f3"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b66">REDUNDANCY</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#172033">Có thiết bị thứ hai</text><rect x="55" y="155" width="450" height="350" rx="26" fill="#fff" stroke="#dfe5ec"/><g font-family="Arial,sans-serif"><rect x="115" y="225" width="135" height="145" rx="18" fill="#e8f1ff" stroke="#8fb3e8"/><text x="182" y="282" text-anchor="middle" font-size="22" font-weight="800" fill="#183b66">NODE A</text><text x="182" y="322" text-anchor="middle" font-size="17" fill="#39465e">ACTIVE</text><rect x="310" y="225" width="135" height="145" rx="18" fill="#f2f4f7" stroke="#c7d2df"/><text x="377" y="282" text-anchor="middle" font-size="22" font-weight="800" fill="#667085">NODE B</text><text x="377" y="322" text-anchor="middle" font-size="17" fill="#667085">STANDBY</text><path d="M250 297h60" stroke="#9aa8ba" stroke-width="6" stroke-dasharray="10 9"/><text x="280" y="420" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Architecture trông có vẻ an toàn</text><text x="280" y="452" text-anchor="middle" font-size="17" fill="#667085">Nhưng chưa có failure nào xảy ra.</text></g><circle cx="600" cy="330" r="50" fill="#183b66"/><text x="600" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#fff">≠</text><text x="695" y="72" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2f6b46">HIGH AVAILABILITY</text><text x="695" y="112" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#172033">Failure đã được xử lý</text><rect x="675" y="155" width="470" height="350" rx="26" fill="#fff" stroke="#dfe5ec"/><g font-family="Arial,sans-serif"><circle cx="735" cy="225" r="23" fill="#fdecec"/><text x="775" y="232" font-size="20" font-weight="700" fill="#172033">Failure được detect</text><circle cx="735" cy="285" r="23" fill="#fff1e8"/><text x="775" y="292" font-size="20" font-weight="700" fill="#172033">Role transition đúng</text><circle cx="735" cy="345" r="23" fill="#e8f1ff"/><text x="775" y="352" font-size="20" font-weight="700" fill="#172033">Traffic chuyển đúng path</text><circle cx="735" cy="405" r="23" fill="#e6f4ea"/><text x="775" y="412" font-size="20" font-weight="700" fill="#172033">Service được validation</text><text x="910" y="468" text-anchor="middle" font-size="19" font-weight="700" fill="#2f6b46">Failure behavior đã được chứng minh</text></g><text x="600" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#172033">High Availability không phải số lượng node.</text><text x="600" y="628" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#667085">Nó là cách hệ thống cư xử khi một dependency thật sự biến mất.</text></svg>