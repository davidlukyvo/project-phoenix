<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Vòng lặp Resilience</title><desc id="d">Sự cố dẫn tới phát hiện, ứng phó, phục hồi, học hỏi và cải thiện khả năng chuẩn bị cho lần tiếp theo.</desc><rect width="1200" height="560" fill="#fff"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Resilience là một vòng lặp, không phải một trạng thái</text><g font-family="Arial,sans-serif"><g transform="translate(90 180)"><circle cx="70" cy="70" r="58" fill="#fdecec"/><text x="70" y="66" text-anchor="middle" font-size="40">!</text><text x="70" y="135" text-anchor="middle" font-size="20" font-weight="800" fill="#b42318">SỰ CỐ</text><text x="70" y="162" text-anchor="middle" font-size="16" fill="#667085">Service bị ảnh hưởng</text></g><g transform="translate(305 180)"><circle cx="70" cy="70" r="58" fill="#fff1e8"/><text x="70" y="66" text-anchor="middle" font-size="34">◎</text><text x="70" y="135" text-anchor="middle" font-size="20" font-weight="800" fill="#d35400">PHÁT HIỆN</text><text x="70" y="162" text-anchor="middle" font-size="16" fill="#667085">Hiểu đúng signal</text></g><g transform="translate(520 180)"><circle cx="70" cy="70" r="58" fill="#fff0f0"/><text x="70" y="66" text-anchor="middle" font-size="34">→</text><text x="70" y="135" text-anchor="middle" font-size="20" font-weight="800" fill="#b42318">ỨNG PHÓ</text><text x="70" y="162" text-anchor="middle" font-size="16" fill="#667085">Kích hoạt runbook</text></g><g transform="translate(735 180)"><circle cx="70" cy="70" r="58" fill="#e8f1ff"/><text x="70" y="66" text-anchor="middle" font-size="34">↻</text><text x="70" y="135" text-anchor="middle" font-size="20" font-weight="800" fill="#2f6bd1">PHỤC HỒI</text><text x="70" y="162" text-anchor="middle" font-size="16" fill="#667085">Khôi phục dịch vụ</text></g><g transform="translate(950 180)"><circle cx="70" cy="70" r="58" fill="#f0eaff"/><text x="70" y="66" text-anchor="middle" font-size="34">↗</text><text x="70" y="135" text-anchor="middle" font-size="20" font-weight="800" fill="#6941c6">HỌC HỎI</text><text x="70" y="162" text-anchor="middle" font-size="16" fill="#667085">RCA &amp; cải tiến</text></g><g stroke="#aab7c6" stroke-width="5" fill="none" stroke-linecap="round"><path d="M230 250h110"/><path d="M445 250h110"/><path d="M660 250h110"/><path d="M875 250h110"/></g><path d="M1020 390 C1010 500 190 500 160 390" fill="none" stroke="#2f6bd1" stroke-width="5" stroke-dasharray="12 10"/><text x="590" y="495" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6bd1">Mỗi incident tốt nhất nên làm hệ thống sẵn sàng hơn cho lần tiếp theo.</text></g></svg>