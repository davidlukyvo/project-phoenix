<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Từ panel đến câu hỏi vận hành</title><desc id="d">Minh họa cách chuyển từ nhiều dashboard panel sang các câu hỏi hỗ trợ quyết định vận hành.</desc><rect width="1200" height="620" fill="#f8fafc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Dashboard chỉ có giá trị khi trả lời được một câu hỏi vận hành</text><g font-family="Arial,sans-serif"><rect x="70" y="145" width="420" height="345" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="280" y="195" text-anchor="middle" font-size="24" font-weight="800" fill="#183b66">NHIỀU PANEL</text><g fill="#edf2f7" stroke="#dfe5ec"><rect x="105" y="230" width="145" height="88" rx="14"/><rect x="275" y="230" width="145" height="88" rx="14"/><rect x="105" y="345" width="145" height="88" rx="14"/><rect x="275" y="345" width="145" height="88" rx="14"/></g><g font-size="18" fill="#39465e" text-anchor="middle"><text x="177" y="283">CPU</text><text x="347" y="283">RAM</text><text x="177" y="398">Traffic</text><text x="347" y="398">Logs</text></g><circle cx="600" cy="315" r="52" fill="#183b66"/><text x="600" y="332" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">?</text><rect x="710" y="125" width="420" height="385" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="920" y="180" text-anchor="middle" font-size="24" font-weight="800" fill="#183b66">CÂU HỎI VẬN HÀNH</text><g font-size="19" fill="#39465e"><circle cx="755" cy="245" r="8" fill="#2f6bd1"/><text x="780" y="252">Site nào đang bị ảnh hưởng?</text><circle cx="755" cy="300" r="8" fill="#2f6bd1"/><text x="780" y="307">Signal nào đáng kiểm tra trước?</text><circle cx="755" cy="355" r="8" fill="#2f6bd1"/><text x="780" y="362">Có correlation giữa các lớp không?</text><circle cx="755" cy="410" r="8" fill="#2f6bd1"/><text x="780" y="417">Bước hành động tiếp theo là gì?</text></g><text x="600" y="565" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Ít panel hơn nhưng nhiều context hơn thường làm NOC hữu ích hơn.</text></g></svg>