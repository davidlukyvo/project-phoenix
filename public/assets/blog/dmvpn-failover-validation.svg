<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:34px;font-weight:800}.h{font-size:22px;font-weight:700}.s{font-size:18px}.sm{font-size:16px;fill:#5b6677}.box{fill:#fff;stroke:#d9e2ec;stroke-width:2}.line{stroke:#245ea8;stroke-width:5;fill:none}</style><rect width="1200" height="675" fill="#f8fafc"/><text x="60" y="70" class="t">Failover chỉ hoàn tất khi service được xác nhận</text><text x="60" y="108" class="sm">Một đường WAN mất không nên biến thành một incident kéo dài ở lớp ứng dụng.</text><rect x="65" y="240" width="180" height="120" rx="20" class="box"/><circle cx="155" cy="220" r="30" fill="#173b69"/><text x="155" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text><text x="155" y="285" text-anchor="middle" class="h">WAN FAILS</text><text x="155" y="322" text-anchor="middle" class="sm">Carrier / link</text><rect x="280" y="240" width="180" height="120" rx="20" class="box"/><circle cx="370" cy="220" r="30" fill="#173b69"/><text x="370" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text><text x="370" y="285" text-anchor="middle" class="h">TUNNEL</text><text x="370" y="322" text-anchor="middle" class="sm">Backup overlay</text><rect x="495" y="240" width="180" height="120" rx="20" class="box"/><circle cx="585" cy="220" r="30" fill="#173b69"/><text x="585" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="585" y="285" text-anchor="middle" class="h">OSPF</text><text x="585" y="322" text-anchor="middle" class="sm">Route converges</text><rect x="710" y="240" width="180" height="120" rx="20" class="box"/><circle cx="800" cy="220" r="30" fill="#173b69"/><text x="800" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text><text x="800" y="285" text-anchor="middle" class="h">PATH</text><text x="800" y="322" text-anchor="middle" class="sm">Reachability</text><rect x="925" y="240" width="180" height="120" rx="20" class="box"/><circle cx="1015" cy="220" r="30" fill="#173b69"/><text x="1015" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text><text x="1015" y="285" text-anchor="middle" class="h">SERVICE</text><text x="1015" y="322" text-anchor="middle" class="sm">User validation</text><path d="M245 300H280 M460 300H495 M675 300H710 M890 300H925" class="line"/><text x="600" y="470" text-anchor="middle" class="h">Rollback trigger phải được quyết định trước maintenance window.</text><text x="600" y="510" text-anchor="middle" class="sm">Nếu convergence hoặc service validation vượt ngưỡng chấp nhận, quay về trạng thái an toàn đã chuẩn bị.</text></svg>