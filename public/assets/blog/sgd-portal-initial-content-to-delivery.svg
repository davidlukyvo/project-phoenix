<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Version đầu - Content-to-Delivery</title>
<desc id="desc">Luồng ban đầu từ Business qua SharePoint, Deploy Host, Amazon S3, CloudFront đến User.</desc>
<style>
  .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#d8e2ee;stroke-width:2}.box{fill:#fff;stroke:#cbd8e6;stroke-width:2}.business{fill:#eef9f4;stroke:#b8dfcc}.title{font:700 44px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#0f5eb8}.body{font:400 22px 'Segoe UI',Arial,sans-serif;fill:#42526b}.label{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#10233f}.small{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#66788a}.arrow{stroke:#50647e;stroke-width:5;fill:none;marker-end:url(#a)}.badge{fill:#e7f0fb}.badgeText{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#173f8a}.icon{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#173f8a}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#50647e"/></marker></defs>
<rect class="bg" width="1400" height="900"/><rect class="panel" x="35" y="35" rx="26" width="1330" height="830"/>
<circle class="badge" cx="100" cy="102" r="38"/><text class="badgeText" x="100" y="112" text-anchor="middle">1</text>
<text class="title" x="165" y="105">Version đầu</text><text class="sub" x="165" y="145">Content-to-Delivery</text>
<text class="body" x="70" y="190">Khi bài toán chủ yếu vẫn là đưa một published bundle từ SharePoint lên AWS.</text>
<rect class="business" x="335" y="240" rx="18" width="730" height="105"/><text class="label" x="520" y="285">Business</text><text class="small" x="520" y="320">Tạo và cập nhật nội dung</text><text class="icon" x="420" y="303">● ● ●</text>
<path class="arrow" d="M700 345 L700 390"/>
<rect class="box" x="335" y="400" rx="18" width="730" height="105"/><text class="label" x="520" y="445">SharePoint</text><text class="small" x="520" y="480">Published Bundle</text><text class="icon" x="420" y="463">SP</text>
<path class="arrow" d="M700 505 L700 550"/>
<rect class="box" x="335" y="560" rx="18" width="730" height="105"/><text class="label" x="520" y="605">Deploy Host</text><text class="small" x="520" y="640">Download và deploy</text><text class="icon" x="420" y="623">▰</text>
<path class="arrow" d="M700 665 L700 710"/>
<rect class="box" x="335" y="720" rx="18" width="330" height="105"/><text class="label" x="435" y="765">Amazon S3</text><text class="small" x="435" y="800">Static content</text><text class="icon" x="380" y="784">S3</text>
<path class="arrow" d="M665 772 L760 772"/>
<rect class="box" x="775" y="720" rx="18" width="290" height="105"/><text class="label" x="845" y="765">CloudFront</text><text class="small" x="845" y="800">Delivery</text><text class="icon" x="810" y="784">CF</text>
<path class="arrow" d="M1065 772 L1170 772"/><text class="label" x="1200" y="765">User</text><text class="small" x="1200" y="800">Truy cập portal</text>
</svg>