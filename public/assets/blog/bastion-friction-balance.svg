<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Cân bằng Security Control và Operational Friction</title><desc id="d">Minh họa ba trạng thái access quá rộng, cân bằng và quá chặt.</desc><rect width="1200" height="620" fill="#f8fafc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Security Control tốt phải giảm risk mà không tạo workaround</text><g font-family="Arial,sans-serif"><rect x="65" y="150" width="320" height="360" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="225" y="205" text-anchor="middle" font-size="24" font-weight="800" fill="#b42318">QUÁ RỘNG</text><text x="225" y="265" text-anchor="middle" font-size="20" fill="#39465e">Full sudo</text><text x="225" y="310" text-anchor="middle" font-size="20" fill="#39465e">Large blast radius</text><text x="225" y="355" text-anchor="middle" font-size="20" fill="#39465e">Convenient</text><text x="225" y="430" text-anchor="middle" font-size="21" font-weight="700" fill="#b42318">Risk cao</text><rect x="440" y="125" width="320" height="410" rx="24" fill="#fff" stroke="#2f6bd1" stroke-width="3"/><text x="600" y="190" text-anchor="middle" font-size="24" font-weight="800" fill="#183b66">CÂN BẰNG</text><text x="600" y="255" text-anchor="middle" font-size="20" fill="#39465e">Approved operations</text><text x="600" y="300" text-anchor="middle" font-size="20" fill="#39465e">Approved targets</text><text x="600" y="345" text-anchor="middle" font-size="20" fill="#39465e">Enough autonomy</text><text x="600" y="390" text-anchor="middle" font-size="20" fill="#39465e">Clear audit trail</text><text x="600" y="470" text-anchor="middle" font-size="21" font-weight="700" fill="#2f6bd1">Least Privilege thực dụng</text><rect x="815" y="150" width="320" height="360" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="975" y="205" text-anchor="middle" font-size="24" font-weight="800" fill="#b54708">QUÁ CHẶT</text><text x="975" y="265" text-anchor="middle" font-size="20" fill="#39465e">Mọi thao tác phải ticket</text><text x="975" y="310" text-anchor="middle" font-size="20" fill="#39465e">High friction</text><text x="975" y="355" text-anchor="middle" font-size="20" fill="#39465e">Workaround xuất hiện</text><text x="975" y="430" text-anchor="middle" font-size="21" font-weight="700" fill="#b54708">Control phản tác dụng</text><text x="600" y="585" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Mục tiêu không phải ít quyền nhất. Mục tiêu là đúng quyền nhất.</text></g></svg>