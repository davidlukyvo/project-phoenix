<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Hệ thống vẫn chạy tốt, tại sao vẫn phải thay?</title><desc id="desc">Minh họa sự khác nhau giữa Performance Capacity còn dư và Lifecycle Risk đang tăng.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#fff9f4"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b66" flood-opacity=".12"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="60" y="78" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#2f6b46">PERFORMANCE CAPACITY</text><text x="60" y="111" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">VẪN CÒN DƯ</text><text x="790" y="78" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#d35400">LIFECYCLE RISK</text><text x="790" y="111" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">ĐANG TĂNG</text><rect x="55" y="145" width="500" height="380" rx="24" fill="#fff" stroke="#dfe5ec" filter="url(#shadow)"/><rect x="645" y="145" width="500" height="380" rx="24" fill="#fff" stroke="#eaded2" filter="url(#shadow)"/><g font-family="Arial, sans-serif"><text x="95" y="205" font-size="21" font-weight="700" fill="#183b66">Workload hiện tại</text><text x="95" y="258" font-size="18" fill="#39465e">CPU</text><rect x="195" y="239" width="270" height="20" rx="10" fill="#edf2f7"/><rect x="195" y="239" width="54" height="20" rx="10" fill="#55a870"/><text x="480" y="256" text-anchor="end" font-size="18" font-weight="700" fill="#2f6b46">20%</text><text x="95" y="318" font-size="18" fill="#39465e">RAM</text><rect x="195" y="299" width="270" height="20" rx="10" fill="#edf2f7"/><rect x="195" y="299" width="82" height="20" rx="10" fill="#55a870"/><text x="480" y="316" text-anchor="end" font-size="18" font-weight="700" fill="#2f6b46">30%</text><text x="95" y="378" font-size="18" fill="#39465e">Traffic</text><rect x="195" y="359" width="270" height="20" rx="10" fill="#edf2f7"/><rect x="195" y="359" width="105" height="20" rx="10" fill="#55a870"/><text x="480" y="376" text-anchor="end" font-size="18" font-weight="700" fill="#2f6b46">~40%</text><circle cx="137" cy="452" r="28" fill="#e6f4ea"/><path d="M124 452l9 9 18-21" fill="none" stroke="#2f8b57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="185" y="446" font-size="19" font-weight="700" fill="#2f6b46">Hiện tại: vẫn đủ sức</text><text x="185" y="474" font-size="16" fill="#667085">Không có dấu hiệu quá tải rõ ràng</text><text x="685" y="205" font-size="21" font-weight="700" fill="#183b66">Rủi ro vòng đời</text><g font-size="18" fill="#39465e"><circle cx="705" cy="258" r="8" fill="#e76f51"/><text x="730" y="264">EOS / EOL</text><circle cx="705" cy="313" r="8" fill="#e76f51"/><text x="730" y="319">Giảm hoặc hết Security Support</text><circle cx="705" cy="368" r="8" fill="#e76f51"/><text x="730" y="374">Hardware failure probability tăng</text><circle cx="705" cy="423" r="8" fill="#e76f51"/><text x="730" y="429">Khó tìm spare part / support</text><circle cx="705" cy="478" r="8" fill="#e76f51"/><text x="730" y="484">Recovery time có thể kéo dài</text></g></g><line x1="590" y1="180" x2="590" y2="500" stroke="#c7d2df" stroke-width="3"/><circle cx="590" cy="335" r="48" fill="#183b66"/><text x="590" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#fff">≠</text><text x="600" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">“Còn chạy được” và “còn nên tiếp tục tin cậy” là hai câu hỏi khác nhau.</text><text x="600" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#667085">Capacity cho biết sức gánh workload. Lifecycle cho biết mức độ đáng tin của nền tảng trong tương lai.</text></svg>