<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f7f9fc"/><text x="55" y="70" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172b4d">DASHBOARD ≠ REALITY</text><text x="55" y="110" font-family="Arial,sans-serif" font-size="18" fill="#5b6b82">Dashboard là biểu diễn của hệ thống — không phải chính hệ thống.</text><rect x="55" y="155" width="470" height="355" rx="22" fill="#fff" stroke="#dbe3ee"/><text x="90" y="205" font-family="Arial" font-size="22" font-weight="700" fill="#17365d">MONITORING DASHBOARD</text><text x="90" y="260" font-family="Arial" font-size="18" fill="#5b6b82">Uptime</text><text x="90" y="310" font-family="Arial" font-size="48" font-weight="700" fill="#d94c3d">98.2%</text><text x="300" y="260" font-family="Arial" font-size="18" fill="#5b6b82">Sensor</text><text x="300" y="310" font-family="Arial" font-size="38" font-weight="700" fill="#d94c3d">UNKNOWN</text><path d="M90 405 C150 360 205 430 260 380 S370 350 470 390" fill="none" stroke="#2f7d5c" stroke-width="7"/><text x="560" y="355" font-family="Arial" font-size="72" font-weight="700" fill="#17365d">≠</text><rect x="675" y="155" width="470" height="355" rx="22" fill="#fff" stroke="#dbe3ee"/><text x="710" y="205" font-family="Arial" font-size="22" font-weight="700" fill="#17365d">REALITY</text><g font-family="Arial" font-size="21" fill="#26384f"><circle cx="730" cy="270" r="13" fill="#32a66a"/><text x="760" y="278">Core service đang Running</text><circle cx="730" cy="335" r="13" fill="#32a66a"/><text x="760" y="343">Không ghi nhận device downtime</text><circle cx="730" cy="400" r="13" fill="#32a66a"/><text x="760" y="408">Không có service interruption tương ứng</text></g><text x="55" y="575" font-family="Arial" font-size="25" font-weight="700" fill="#172b4d">Một con số chính xác không đồng nghĩa với một sự thật chính xác.</text></svg>