<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
<title id="title">Version cuối - Content-to-Access Architecture</title>
<desc id="desc">Kiến trúc cuối của SGD Portal với boundary rõ ràng từ content ownership đến authorization, cùng số liệu before vs after của incremental deployment.</desc>
<style>
.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#d8e2ee;stroke-width:2}.lane{stroke-width:2}.c1{fill:#eef9f4;stroke:#b8dfcc}.c2{fill:#eef6ff;stroke:#bed8f4}.c3{fill:#fff7ea;stroke:#f2d19d}.c4{fill:#f5f0ff;stroke:#d8c7f3}.c5{fill:#fff0f2;stroke:#efbcc3}.auth{fill:#edf6ff;stroke:#b9d7f5}.authz{fill:#fff0f0;stroke:#ef8d8d;stroke-width:3}.box{fill:#fff;stroke:#cbd8e6;stroke-width:2}.title{font:700 42px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#0f5eb8}.laneTitle{font:700 25px 'Segoe UI',Arial,sans-serif}.label{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#10233f}.small{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#5d6d82}.tiny{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#5d6d82}.arrow{stroke:#50647e;stroke-width:4;fill:none;marker-end:url(#a)}.metric{fill:#fff;stroke:#cbd8e6;stroke-width:2}.metricBlue{fill:#eef6ff;stroke:#92c3ee;stroke-width:2}.metricGreen{fill:#eefaf2;stroke:#9fd8b2;stroke-width:2}.metricH{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#173f8a}.metricN{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.quote{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#172033}.qpanel{fill:#fff7ed;stroke:#f0d7b4;stroke-width:2}
</style>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#50647e"/></marker></defs>
<rect class="bg" width="1600" height="1280"/>
<rect class="panel" x="35" y="35" rx="26" width="1530" height="885"/>
<text class="title" x="75" y="95">Version cuối</text><text class="sub" x="75" y="135">Content-to-Access Architecture</text><text class="small" x="75" y="172">Content ownership, deployment, delivery, authentication và authorization được tách thành những boundary rõ ràng.</text>

<rect class="lane c1" x="75" y="210" rx="16" width="1450" height="105"/><text class="laneTitle" x="100" y="252" fill="#14613c">Content</text><text class="tiny" x="100" y="280">Do business quản lý</text><rect class="box" x="430" y="225" rx="14" width="500" height="75"/><text class="label" x="470" y="258">SharePoint</text><text class="small" x="470" y="284">Published Bundle / Current</text><text class="tiny" x="1030" y="255">Business tạo và publish nội dung</text><text class="tiny" x="1030" y="280">trên công cụ quen thuộc.</text>
<path class="arrow" d="M680 300 L680 347"/><text class="tiny" x="720" y="333">Microsoft Graph · App-only Certificate · Sites.Selected</text>

<rect class="lane c2" x="75" y="355" rx="16" width="1450" height="105"/><text class="laneTitle" x="100" y="397" fill="#145faa">Deployment</text><text class="tiny" x="100" y="425">Do hạ tầng quản lý</text><rect class="box" x="430" y="370" rx="14" width="500" height="75"/><text class="label" x="470" y="403">Deploy Host</text><text class="small" x="470" y="429">Manifest / Validation / Guard</text><text class="tiny" x="1030" y="400">Lấy nội dung, kiểm tra, đồng bộ</text><text class="tiny" x="1030" y="425">và deploy theo release đã xác nhận.</text>
<path class="arrow" d="M680 445 L680 492"/>

<rect class="lane c3" x="75" y="500" rx="16" width="1450" height="105"/><text class="laneTitle" x="100" y="542" fill="#b85a00">Storage</text><text class="tiny" x="100" y="570">Private</text><rect class="box" x="430" y="515" rx="14" width="500" height="75"/><text class="label" x="470" y="548">Amazon S3</text><text class="small" x="470" y="574">Private bucket</text><text class="tiny" x="1030" y="545">Static content không public.</text>
<path class="arrow" d="M680 590 L680 637"/><text class="tiny" x="720" y="625">Origin Access Control (OAC)</text>

<rect class="lane c4" x="75" y="645" rx="16" width="1450" height="105"/><text class="laneTitle" x="100" y="687" fill="#6c35b7">Delivery</text><text class="tiny" x="100" y="715">Phân phối nội dung</text><rect class="box" x="430" y="660" rx="14" width="500" height="75"/><text class="label" x="470" y="693">CloudFront</text><text class="small" x="470" y="719">Content delivery</text><text class="tiny" x="1030" y="690">CloudFront đọc content từ S3</text><text class="tiny" x="1030" y="715">thông qua OAC.</text>
<path class="arrow" d="M680 735 L680 782"/>

<rect class="lane c5" x="75" y="790" rx="16" width="1450" height="105"/><text class="laneTitle" x="100" y="832" fill="#b11f32">Edge Logic</text><text class="tiny" x="100" y="860">Bảo vệ truy cập</text><rect class="box" x="430" y="805" rx="14" width="500" height="75"/><text class="label" x="470" y="838">Lambda@Edge</text><text class="small" x="470" y="864">Kiểm tra authentication / session</text><text class="tiny" x="1030" y="835">Chạy trên request path</text><text class="tiny" x="1030" y="860">trước khi cho phép truy cập content.</text>

<rect class="panel" x="75" y="945" rx="22" width="930" height="285"/>
<text class="title" x="110" y="1000" style="font-size:30px">Before vs After Metrics</text><text class="small" x="110" y="1035">Từ full sync đến incremental deployment.</text>
<rect class="metric" x="110" y="1065" rx="14" width="245" height="125"/><text class="metricH" x="135" y="1100">Initial Bundle</text><text class="metricN" x="135" y="1140">1,903 files</text><text class="metricN" x="135" y="1175">652 MB</text>
<path class="arrow" d="M365 1128 L420 1128"/>
<rect class="metricBlue" x="435" y="1065" rx="14" width="245" height="125"/><text class="metricH" x="460" y="1100">Current Bundle</text><text class="metricN" x="460" y="1140">27,641 files</text><text class="metricN" x="460" y="1175">1.6 GB</text>
<path class="arrow" d="M690 1128 L745 1128"/>
<rect class="metricGreen" x="760" y="1065" rx="14" width="210" height="125"/><text class="metricH" x="785" y="1100">Incremental</text><text class="metricN" x="785" y="1140">Downloaded: 0</text><text class="metricN" x="785" y="1175">Skipped: 27,641</text>

<rect class="auth" x="1050" y="945" rx="18" width="475" height="115"/><text class="laneTitle" x="1075" y="985" fill="#145faa">Authentication</text><text class="label" x="1240" y="985">Amazon Cognito</text><text class="small" x="1240" y="1015">OIDC Federation với Entra ID</text><text class="tiny" x="1075" y="1042">Authentication flow, token và session.</text>
<path class="arrow" d="M1285 1060 L1285 1090"/>
<rect class="authz" x="1050" y="1095" rx="18" width="475" height="135"/><text class="laneTitle" x="1075" y="1135" fill="#b42318">Authorization</text><text class="label" x="1240" y="1135">Microsoft Entra ID</text><text class="small" x="1240" y="1165">Enterprise Application</text><text class="small" x="1240" y="1192">Assignment Required</text><text class="tiny" x="1075" y="1215">Một nơi rõ ràng để quản lý ai được phép sử dụng application.</text>

<rect class="qpanel" x="75" y="1240" rx="16" width="1450" height="0"/>
</svg>