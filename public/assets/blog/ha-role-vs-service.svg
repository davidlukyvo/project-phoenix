<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Role transition chưa phải service availability</title><desc id="d">Sau failover còn phải xác nhận network path, listener, session, dependency và application function.</desc><rect width="1200" height="560" fill="#f8fafc"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Role đã đổi chưa có nghĩa Service đã sẵn sàng</text><g font-family="Arial,sans-serif"><rect x="70" y="145" width="260" height="280" rx="24" fill="#fff" stroke="#dfe5ec"/><circle cx="200" cy="225" r="48" fill="#e6f4ea"/><path d="M176 226l17 17 34-40" fill="none" stroke="#2f8b57" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="315" text-anchor="middle" font-size="24" font-weight="800" fill="#172033">Failover OK</text><text x="200" y="355" text-anchor="middle" font-size="18" fill="#667085">Standby đã thành Active</text><text x="200" y="388" text-anchor="middle" font-size="18" fill="#667085">hoặc Secondary thành Primary</text><circle cx="400" cy="285" r="44" fill="#183b66"/><text x="400" y="300" text-anchor="middle" font-size="45" font-weight="800" fill="#fff">?</text><rect x="485" y="115" width="645" height="345" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="807" y="165" text-anchor="middle" font-size="24" font-weight="800" fill="#183b66">SERVICE VALIDATION</text><rect x="515" y="195" width="280" height="220" rx="18" fill="#f8fbff" stroke="#e1e8f0"/><rect x="820" y="195" width="280" height="220" rx="18" fill="#fbf9ff" stroke="#e7e0f5"/><text x="655" y="228" text-anchor="middle" font-size="17" font-weight="800" fill="#2f6bd1">TECHNICAL PATH</text><text x="960" y="228" text-anchor="middle" font-size="17" font-weight="800" fill="#6941c6">BUSINESS SERVICE</text><g font-size="16" fill="#39465e"><circle cx="540" cy="265" r="7" fill="#2f6bd1"/><text x="560" y="271">Network path đúng</text><circle cx="540" cy="305" r="7" fill="#2f6bd1"/><text x="560" y="311">VIP / listener / route reachable</text><circle cx="540" cy="345" r="7" fill="#2f6bd1"/><text x="560" y="351">Session / connection phục hồi</text><circle cx="540" cy="385" r="7" fill="#2f6bd1"/><text x="560" y="391">Dependency vẫn hoạt động</text><circle cx="845" cy="265" r="7" fill="#6941c6"/><text x="865" y="271">Application login thành công</text><circle cx="845" cy="305" r="7" fill="#6941c6"/><text x="865" y="311">Transaction / API thực thi</text><circle cx="845" cy="345" r="7" fill="#6941c6"/><text x="865" y="351">Report / integration vẫn chạy</text><circle cx="845" cy="385" r="7" fill="#6941c6"/><text x="865" y="391">Business user xác nhận usable</text></g><text x="600" y="515" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">HA chỉ có ý nghĩa khi validation đi đến tận service mà business thật sự sử dụng.</text></g></svg>