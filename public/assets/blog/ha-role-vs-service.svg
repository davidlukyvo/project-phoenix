<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Role transition chưa phải service availability</title><desc id="d">Sau failover còn phải xác nhận network path, listener, session, dependency và application function.</desc><rect width="1200" height="560" fill="#f8fafc"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Role đã đổi chưa có nghĩa Service đã sẵn sàng</text><g font-family="Arial,sans-serif"><rect x="70" y="145" width="260" height="280" rx="24" fill="#fff" stroke="#dfe5ec"/><circle cx="200" cy="225" r="48" fill="#e6f4ea"/><path d="M176 226l17 17 34-40" fill="none" stroke="#2f8b57" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="315" text-anchor="middle" font-size="24" font-weight="800" fill="#172033">Failover OK</text><text x="200" y="355" text-anchor="middle" font-size="18" fill="#667085">Standby đã thành Active</text><text x="200" y="388" text-anchor="middle" font-size="18" fill="#667085">hoặc Secondary thành Primary</text><circle cx="400" cy="285" r="44" fill="#183b66"/><text x="400" y="300" text-anchor="middle" font-size="45" font-weight="800" fill="#fff">?</text><rect x="485" y="115" width="645" height="345" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="807" y="165" text-anchor="middle" font-size="24" font-weight="800" fill="#183b66">SERVICE VALIDATION</text><g font-size="19" fill="#39465e"><circle cx="545" cy="225" r="9" fill="#2f6bd1"/><text x="575" y="232">Network path đúng</text><circle cx="545" cy="275" r="9" fill="#2f6bd1"/><text x="575" y="282">VIP / listener / route reachable</text><circle cx="545" cy="325" r="9" fill="#2f6bd1"/><text x="575" y="332">Session hoặc connection phục hồi</text><circle cx="545" cy="375" r="9" fill="#2f6bd1"/><text x="575" y="382">Dependency phía sau vẫn hoạt động</text><circle cx="860" cy="225" r="9" fill="#6941c6"/><text x="890" y="232">Application login thành công</text