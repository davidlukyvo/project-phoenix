<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:34px;font-weight:800}.h{font-size:22px;font-weight:700}.s{font-size:18px}.sm{font-size:16px;fill:#5b6677}.box{fill:#fff;stroke:#d9e2ec;stroke-width:2}</style><rect width="1200" height="675" fill="#f7f9fc"/><text x="60" y="70" class="t">Tunnel UP chưa có nghĩa hệ thống đã thông</text><text x="60" y="108" class="sm">Một checklist tốt đi qua cả control plane và data plane.</text><rect x="90" y="170" width="430" height="360" rx="24" class="box"/><text x="305" y="215" text-anchor="middle" class="h">CONTROL PLANE</text><text x="140" y="275" class="s">✓ DMVPN tunnel established</text><text x="140" y="325" class="s">✓ OSPF neighbor FULL</text><text x="140" y="375" class="s">✓ Routes learned</text><text x="140" y="425" class="s">✓ Default / summary route expected</text><text x="305" y="485" text-anchor="middle" class="sm">“Network nhìn có vẻ đúng.”</text><rect x="680" y="170" width="430" height="360" rx="24" class="box"/><text x="895" y="215" text-anchor="middle" class="h">DATA PLANE + SERVICE</text><text x="730" y="275" class="s">✓ Ping / traceroute path</text><text x="730" y="325" class="s">✓ Return traffic</text><text x="730" y="375" class="s">✓ Application reachable</text><text x="730" y="425" class="s">✓ User workflow usable</text><text x="895" y="485" text-anchor="middle" class="sm">“Business thật sự sử dụng được.”</text><circle cx="600" cy="350" r="48" fill="#173b69"/><text x="600" y="365" text-anchor="middle" font-size="48" font-weight="800" fill="#fff">≠</text><text x="600" y="610" text-anchor="middle" class="h">Network validation phải đi xa hơn trạng thái tunnel.</text></svg>