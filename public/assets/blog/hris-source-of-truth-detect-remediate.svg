<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">HRIS Source of Truth - Detect before Remediate</title>
<desc id="desc">Identity governance flow from HRIS through read-only middleware and reconciliation to either long-term detect-only handling or controlled remediation into Active Directory and Entra ID.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f2ff"/><stop offset="1" stop-color="#dcecff"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf9f1"/><stop offset="1" stop-color="#dff4e6"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8e8"/><stop offset="1" stop-color="#fff0ca"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#17324d" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c6f99"/></marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#142b46}.muted{fill:#5d7188}.h1{font-size:42px;font-weight:700}.sub{font-size:23px}.boxh{font-size:25px;font-weight:700}.boxp{font-size:18px}.small{font-size:16px}.label{font-size:15px;font-weight:700;letter-spacing:.08em}.quote{font-size:22px;font-weight:700}.flow{stroke:#4c6f99;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#7b91aa;stroke-width:2.5;stroke-dasharray:8 8;fill:none}.card{stroke:#c5d4e4;stroke-width:2}.pill{font-size:15px;font-weight:700}
  </style>
</defs>
<rect width="1600" height="980" rx="28" fill="url(#bg)"/>
<text x="70" y="75" class="t label" fill="#2563eb">IDENTITY GOVERNANCE</text>
<text x="70" y="125" class="t h1">HRIS là Source of Truth, nhưng không có nghĩa là được phép sửa AD ngay</text>
<text x="70" y="165" class="t sub muted">Detect trước. Xác minh. Và chỉ remediate khi từng rule đủ điều kiện.</text>

<!-- top flow -->
<g filter="url(#shadow)">
  <rect x="70" y="235" width="300" height="150" rx="22" fill="#fff" class="card"/>
  <rect x="425" y="235" width="300" height="150" rx="22" fill="url(#green)" class="card"/>
  <rect x="780" y="235" width="300" height="150" rx="22" fill="url(#blue)" class="card"/>
  <rect x="1135" y="235" width="395" height="150" rx="22" fill="url(#amber)" class="card"/>
</g>
<text x="100" y="280" class="t boxh">HRIS</text><text x="100" y="309" class="t boxp muted">Source of Truth</text>
<text x="100" y="342" class="t small muted">Employee / Org / Manager / Title</text>
<text x="455" y="280" class="t boxh">Middleware</text><text x="455" y="309" class="t boxp muted">Read-only from HRIS</text>
<text x="455" y="342" class="t small muted">Normalize • Map • Transform</text>
<text x="810" y="280" class="t boxh">Reconciliation</text><text x="810" y="309" class="t boxp muted">Compare HRIS ↔ AD</text>
<text x="810" y="342" class="t small muted">Detect mismatch • classify • report</text>
<text x="1165" y="280" class="t boxh">Validation &amp; Guardrails</text><text x="1165" y="309" class="t boxp muted">Identity match • exceptions • impact</text>
<text x="1165" y="342" class="t small muted">Approval / confidence / safe-to-change?</text>

<path d="M370 310 H425" class="flow"/><path d="M725 310 H780" class="flow"/><path d="M1080 310 H1135" class="flow"/>
<path d="M425 365 H385 V355 H370" class="dash"/>
<rect x="280" y="345" width="128" height="34" rx="17" fill="#fff" stroke="#98acc3"/>
<text x="344" y="367" text-anchor="middle" class="t pill">NO WRITE-BACK</text>

<!-- branch -->
<path d="M1330 385 V455 H510 V505" class="flow"/>
<path d="M1330 385 V455 H1085 V505" class="flow"/>

<g filter="url(#shadow)">
  <rect x="300" y="505" width="420" height="250" rx="24" fill="url(#green)" stroke="#7bc892" stroke-width="2.5"/>
  <rect x="875" y="505" width="420" height="250" rx="24" fill="url(#blue)" stroke="#7aa9e7" stroke-width="2.5"/>
</g>
<text x="510" y="555" text-anchor="middle" class="t boxh">Detect-only</text>
<text x="510" y="585" text-anchor="middle" class="t boxp" fill="#23814a">(có thể là trạng thái lâu dài)</text>
<text x="340" y="630" class="t boxp">✓ Log &amp; alert mismatch</text>
<text x="340" y="664" class="t boxp">✓ Assign owner để review</text>
<text x="340" y="698" class="t boxp">✓ Theo dõi exception / trend</text>
<text x="340" y="732" class="t boxp">✓ Không tự động thay đổi identity</text>

<text x="1085" y="555" text-anchor="middle" class="t boxh">Controlled Remediation</text>
<text x="1085" y="585" text-anchor="middle" class="t boxp" fill="#275fa8">(chỉ cho rule đủ điều kiện)</text>
<text x="915" y="630" class="t boxp">✓ Approved attribute / rule</text>
<text x="915" y="664" class="t boxp">✓ Before / after value</text>
<text x="915" y="698" class="t boxp">✓ Error handling + rollback</text>
<text x="915" y="732" class="t boxp">✓ Post-change verification</text>

<!-- AD downstream only from remediation -->
<path d="M1085 755 V800" class="flow"/>
<g filter="url(#shadow)"><rect x="875" y="805" width="420" height="90" rx="20" fill="#fff" class="card"/></g>
<text x="1085" y="842" text-anchor="middle" class="t boxh">Active Directory</text>
<text x="1085" y="872" text-anchor="middle" class="t boxp muted">Selected attributes only • audit trail</text>
<path d="M1295 850 H1370" class="flow"/>
<rect x="1375" y="805" width="155" height="90" rx="20" fill="#fff" class="card"/>
<text x="1452" y="840" text-anchor="middle" class="t boxh">Entra ID</text>
<text x="1452" y="869" text-anchor="middle" class="t small muted">Verify final state</text>

<!-- principles -->
<rect x="70" y="455" width="180" height="300" rx="22" fill="#fff" stroke="#c5d4e4" stroke-width="2"/>
<text x="95" y="500" class="t label" fill="#2563eb">GUARDRAILS</text>
<text x="95" y="540" class="t boxp">• High-confidence match</text>
<text x="95" y="578" class="t boxp">• Exception handling</text>
<text x="95" y="616" class="t boxp">• Least privilege</text>
<text x="95" y="654" class="t boxp">• Audit trail</text>
<text x="95" y="692" class="t boxp">• Rollback path</text>
<text x="95" y="730" class="t boxp">• Fail closed</text>

<text x="70" y="930" class="t quote">Source of Truth cho biết mình nên tin dữ liệu ở đâu. Nó không tự động cấp quyền Write.</text>
<text x="70" y="958" class="t small muted">sangvo.me • Engineering Notes • Identity &amp; Microsoft</text>
</svg>