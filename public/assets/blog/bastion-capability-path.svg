<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Least Privilege theo capability</title><desc id="d">Minh họa access path từ identity qua Bastion tới approved operations và target cụ thể.</desc><rect width="1200" height="620" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="600" y="58" text-anchor="middle" font-size="31" font-weight="800" fill="#172033">Least Privilege nên bắt đầu từ capability</text><text x="600" y="94" text-anchor="middle" font-size="31" font-weight="800" fill="#172033">cần thiết cho công việc</text><rect x="65" y="205" width="210" height="210" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="170" y="255" text-anchor="middle" font-size="22" font-weight="800" fill="#183b66">IDENTITY</text><circle cx="170" cy="320" r="44" fill="#e8f1ff"/><text x="170" y="334" text-anchor="middle" font-size="38" fill="#183b66">U</text><text x="170" y="390" text-anchor="middle" font-size="17" fill="#667085">SSH key-only</text><path d="M275 310h90" stroke="#9aa8ba" stroke-width="6" stroke-linecap="round"/><rect x="365" y="175" width="230" height="270" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="480" y="230" text-anchor="middle" font-size="22" font-weight="800" fill="#183b66">BASTION</text><text x="480" y="282" text-anchor="middle" font-size="18" fill="#39465e">Control point</text><text x="480" y="325" text-anchor="middle" font-size="18" fill="#39465e">Known source path</text><text x="480" y="368" text-anchor="middle" font-size="18" fill="#39465e">Central access policy</text><path d="M595 310h80" stroke="#9aa8ba" stroke-width="6" stroke-linecap="round"/><rect x="675" y="135" width="270" height="350" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="810" y="195" text-anchor="middle" font-size="21" font-weight="800" fill="#2f6b46">APPROVED OPERATIONS</text><g font-size="18" fill="#39465e"><circle cx="720" cy="255" r="8" fill="#2f8b57"/><text x="745" y="262">View status</text><circle cx="720" cy="310" r="8" fill="#2f8b57"/><text x="745" y="317">Read logs</text><circle cx="720" cy="365" r="8" fill="#2f8b57"/><text x="745" y="372">Inspect service</text><circle cx="720" cy="420" r="8" fill="#d97706"/><text x="745" y="427">Restart approved</text><text x="745" y="451">service</text></g><path d="M945 310h80" stroke="#9aa8ba" stroke-width="6" stroke-linecap="round"/><rect x="1025" y="205" width="120" height="210" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="1085" y="255" text-anchor="middle" font-size="20" font-weight="800" fill="#183b66">TARGET</text><text x="1085" y="315" text-anchor="middle" font-size="17" fill="#39465e">Only</text><text x="1085" y="345" text-anchor="middle" font-size="17" fill="#39465e">approved</text><text x="1085" y="375" text-anchor="middle" font-size="17" fill="#39465e">servers</text><text x="600" y="560" text-anchor="middle" font-size="22" font-weight="700" fill="#172033">Không cấp “quyền rộng”. Cấp đúng capability trên đúng target.</text></g></svg>