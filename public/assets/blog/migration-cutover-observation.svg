<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Cutover chỉ là một khoảng khắc</title><desc id="d">Timeline trước, trong và sau cutover cùng mức rủi ro thay đổi theo thời gian.</desc><rect width="1200" height="560" rx="28" fill="#f7f9fc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Cutover chỉ là một khoảnh khắc</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="19" fill="#667085">Phần chuẩn bị kéo dài nhiều ngày; phần kiểm chứng sau thay đổi cũng không kết thúc ngay khi traffic đã chuyển.</text><line x1="110" y1="220" x2="1090" y2="220" stroke="#8da0b8" stroke-width="3"/><circle cx="330" cy="220" r="8" fill="#2f6db5"/><circle cx="650" cy="220" r="10" fill="#e56d37"/><circle cx="925" cy="220" r="8" fill="#3b9b5f"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="330" y="185" font-size="22" font-weight="800" fill="#2f6db5">Trước Cutover</text><text x="330" y="255" font-size="16" fill="#475467">Dependency • FDD • UAT • Rollback</text><text x="650" y="185" font-size="22" font-weight="800" fill="#d85f2a">Cutover</text><text x="650" y="255" font-size="16" fill="#475467">Maintenance Window</text><text x="925" y="185" font-size="22" font-weight="800" fill="#2d8a51">Sau Cutover</text><text x="925" y="255" font-size="16" fill="#475467">Service Validation • Monitoring • Tuning</text></g><path d="M120 410 C240 320 360 330 490 360 C600 385 650 435 745 425 C865 410 930 360 1080 395" fill="none" stroke="#c94c4c" stroke-width="5"/><path d="M120 410 C240 320 360 330 490 360 C600 385 650 435 745 425 C865 410 930 360 1080 395 L1080 470 L120 470 Z" fill="#f9dddd" opacity=".55"/><text x="120" y="315" font-family="Arial,sans-serif" font-size="16" fill="#667085">Mức độ rủi ro</text><text x="1100" y="485" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#667085">Thời gian</text><rect x="160" y="500" width="880" height="38" rx="10" fill="#eef5ff"/><text x="600" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1f5faa">Migration chỉ thật sự kết thúc khi service đã được chứng minh ổn định trong production.</text></svg>