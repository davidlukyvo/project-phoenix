<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Metric cần baseline và context</title><desc id="d">Minh họa một metric chỉ trở thành tín hiệu có ý nghĩa khi được đặt cạnh baseline và operational context.</desc><rect width="1200" height="620" fill="#f8fafc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Một metric chỉ có ý nghĩa khi đi cùng baseline và context</text><g font-family="Arial,sans-serif"><rect x="80" y="185" width="240" height="230" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="200" y="245" text-anchor="middle" font-size="23" font-weight="800" fill="#183b66">METRIC</text><text x="200" y="315" text-anchor="middle" font-size="38" font-weight="800" fill="#b42318">80%</text><text x="200" y="360" text-anchor="middle" font-size="18" fill="#667085">CPU / Traffic / Log rate</text><text x="360" y="315" text-anchor="middle" font-size="44" font-weight="800" fill="#183b66">+</text><rect x="410" y="185" width="240" height="230" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="530" y="245" text-anchor="middle" font-size="23" font-weight="800" fill="#183b66">BASELINE</text><text x="530" y="310" text-anchor="middle" font-size="19" fill="#39465e">Normal range</text><text x="530" y="350" text-anchor="middle" font-size="19" fill="#39465e">P95 và peak pattern</text><text x="690" y="315" text-anchor="middle" font-size="44" font-weight="800" fill="#183b66">+</text><rect x="740" y="185" width="240" height="230" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="860" y="245" text-anchor="middle" font-size="23" font-weight="800" fill="#183b66">CONTEXT</text><text x="860" y="310" text-anchor="middle" font-size="19" fill="#39465e">Migration?</text><text x="860" y="350" text-anchor="middle" font-size="19" fill="#39465e">Backup? Incident?</text><path d="M980 300h80" stroke="#9aa8ba" stroke-width="6" stroke-linecap="round"/><circle cx="1090" cy="300" r="58" fill="#2f6bd1"/><text x="1090" y="286" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">DECIDE</text><text x="1090" y="318" text-anchor="middle" font-size="16" fill="#fff">ACT OR</text><text x="1090" y="344" text-anchor="middle" font-size="16" fill="#fff">IGNORE</text><text x="600" y="535" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Threshold phát hiện khác thường. Engineering judgment quyết định có cần hành động hay không.</text></g></svg>