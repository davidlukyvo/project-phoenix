<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Selected Engineering Chapters 2023 đến 2026</title><desc id="d">Một số chapter gần đây từ WAN và load balancing đến external firewall, internal firewall, IPS, observability, resilience và governance.</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#173b65" flood-opacity=".10"/></filter></defs><rect width="1200" height="650" rx="28" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#172033"><text x="70" y="76" font-size="32" font-weight="800">Một số chapter Engineering gần đây</text><text x="70" y="114" font-size="19" fill="#667085">Từ modernization từng lớp hạ tầng đến cách nhìn hệ thống như một capability có thể kiểm chứng.</text><line x1="135" y1="318" x2="1065" y2="318" stroke="#cbd5e1" stroke-width="6"/><g filter="url(#s)"><rect x="65" y="170" width="245" height="285" rx="22" fill="#fff" stroke="#dbe3ec"/><rect x="330" y="170" width="245" height="285" rx="22" fill="#fff" stroke="#dbe3ec"/><rect x="595" y="170" width="245" height="285" rx="22" fill="#fff" stroke="#dbe3ec"/><rect x="860" y="170" width="275" height="285" rx="22" fill="#fff" stroke="#dbe3ec"/></g><g font-size="22" font-weight="800" fill="#183b66"><text x="90" y="210">2023</text><text x="355" y="210">2024</text><text x="620" y="210">Q1/2025</text><text x="885" y="210">2025–2026</text></g><g font-size="17"><text x="90" y="248">WAN / Load Balancing</text><text x="90" y="278">Peplink migration</text><text x="90" y="308">ILL • AWS Direct Connect</text><text x="90" y="338">HA • UAT • Rollback</text><text x="90" y="368">Right-sized architecture</text><text x="355" y="248">External Firewall</text><text x="355" y="278">PA-3050 → PA-3410</text><text x="355" y="308">Internal FW • Fortinet 200D</text><text x="355" y="338">VPN Pre-logon • HA</text><text x="355" y="368">Service validation</text><text x="620" y="248">Site Firewall modernization</text><text x="620" y="278">600D → 601F • HA</text><text x="620" y="308">Trellix IPS modernization</text><text x="620" y="338">NS-7100 → NS-7500</text><text x="620" y="368">Detect → Prevent</text><text x="885" y="248">Platform thinking</text><text x="885" y="278">Observability • Recovery</text><text x="885" y="308">Least Privilege • DR</text><text x="885" y="338">Governance • Automation</text><text x="885" y="368">Capacity • Lifecycle</text></g><text x="600" y="535" text-anchor="middle" font-size="27" font-weight="800">Thiết bị thay đổi. Câu hỏi Engineering ngày càng đi sâu hơn.</text><text x="600" y="578" text-anchor="middle" font-size="19" fill="#667085">Từ “cấu hình có chạy không?” đến “service có chịu lỗi, phục hồi và vận hành đúng không?”</text></g></svg>