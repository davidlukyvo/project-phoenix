<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Engineering Journey 2023 đến 2026</title><desc id="d">Hành trình từ network modernization đến observability, resilience và governance.</desc><defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#173b65" flood-opacity=".10"/></filter></defs><rect width="1200" height="620" rx="28" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#172033"><text x="70" y="78" font-size="34" font-weight="800">Một hành trình Engineering, không phải danh sách thiết bị</text><text x="70" y="116" font-size="20" fill="#667085">Từ modernization từng platform đến cách nhìn hệ thống như một capability có thể kiểm chứng.</text><line x1="135" y1="300" x2="1065" y2="300" stroke="#cbd5e1" stroke-width="6"/><g filter="url(#s)"><rect x="65" y="180" width="245" height="240" rx="22" fill="#fff" stroke="#dbe3ec"/><rect x="330" y="180" width="245" height="240" rx="22" fill="#fff" stroke="#dbe3ec"/><rect x="595" y="180" width="245" height="240" rx="22" fill="#fff" stroke="#dbe3ec"/><rect x="860" y="180" width="275" height="240" rx="22" fill="#fff" stroke="#dbe3ec"/></g><g font-size="22" font-weight="800" fill="#183b66"><text x="90" y="220">2023</text><text x="355" y="220">2024</text><text x="620" y="220">2025</text><text x="885" y="220">2025–2026</text></g><g font-size="18"><text x="90" y="258">WAN / Load Balancing</text><text x="90" y="288">Peplink migration</text><text x="90" y="318">HA • UAT • Rollback</text><text x="90" y="348">Right-sized architecture</text><text x="355" y="258">Security modernization</text><text x="355" y="288">PA-3050 → PA-3410</text><text x="355" y="318">HA • Policy • Cutover</text><text x="355" y="348">Service validation</text><text x="620" y="258">IPS modernization</text><text x="620" y="288">NS-7100 → NS-7500</text><text x="620" y="318">Detect → Prevent</text><text x="620" y="348">Capacity • Lifecycle</text><text x="885" y="258">Platform thinking</text><text x="885" y="288">Observability • Recovery</text><text x="885" y="318">Least Privilege • DR</text><text x="885" y="348">Governance • Automation</text></g><text x="600" y="510" text-anchor="middle" font-size="27" font-weight="800">Thiết bị thay đổi. Câu hỏi Engineering ngày càng đi sâu hơn.</text><text x="600" y="552" text-anchor="middle" font-size="20" fill="#667085">Từ “cấu hình có chạy không?” đến “hệ thống có chịu lỗi, phục hồi và vận hành được không?”</text></g></svg>