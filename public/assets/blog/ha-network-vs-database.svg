"middle" font-size="16" fill="#d35400">PRIMARY</text><rect x="940" y="225" width="145" height="115" rx="16" fill="#f2f4f7"/><text x="1012" y="270" text-anchor="middle" font-size="20" font-weight="800" fill="#172033">SQL B</text><text x="1012" y="302" text-anchor="middle" font-size="16" fill="#667085">SECONDARY</text><path d="M840 282h100" stroke="#8ea2b8" stroke-width="5" stroke-dasharray="10 8"/><text x="890" y="390" text-anchor="middle" font-size="18" fill="#39465e">Replication + cluster health</text><text x="890" y="425" text-anchor="middle" font-size="18" fill="#39465e">Primary transition + app validation</text><circle cx="600" cy="300" r="44" fill="#183b66"/><text x="600" y="315" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">=</text><text x="600" y="535" text-anchor="middle" font-size="24" font-weight="800" fill="#172033">“Nếu thành phần đang phục vụ biến mất, service có tiếp tục đúng như thiết kế không?”</text><text x="600" y="575" text-anchor="middle" font-size="19" fill="#667085">Vendor khác nhau. Failure behavior vẫn phải được chứng minh.</text></g></svg>