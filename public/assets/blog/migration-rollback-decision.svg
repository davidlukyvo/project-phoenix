<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Rollback Decision Point</title><desc id="d">Quy trình từ phát hiện vấn đề đến khôi phục hệ thống ổn định.</desc><rect width="1200" height="560" rx="28" fill="#f7f9fc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Rollback: kế hoạch cho điều không mong muốn</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="19" fill="#667085">Rollback tốt là rollback đã được diễn tập trước khi cần dùng đến.</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="145" cy="245" r="52" fill="#fff7e6" stroke="#e5a400" stroke-width="3"/><text x="145" y="252" font-size="42" fill="#d18b00">!</text><circle cx="370" cy="245" r="52" fill="#eef5ff" stroke="#2f6db5" stroke-width="3"/><text x="370" y="252" font-size="36" fill="#2f6db5">?</text><circle cx="595" cy="245" r="52" fill="#fff0ef" stroke="#db4c40" stroke-width="3"/><text x="595" y="252" font-size="34" fill="#db4c40">◷</text><circle cx="820" cy="245" r="52" fill="#eef8f1" stroke="#3b9b5f" stroke-width="3"/><text x="820" y="252" font-size="34" fill="#3b9b5f">↶</text><circle cx="1045" cy="245" r="52" fill="#eef8f1" stroke="#3b9b5f" stroke-width="3"/><text x="1045" y="252" font-size="36" fill="#3b9b5f">✓</text><g font-size="19" font-weight="800" fill="#172033"><text x="145" y="330">Phát hiện vấn đề</text><text x="370" y="330">Đánh giá impact</text><text x="595" y="330">Quyết định rollback</text><text x="820" y="330">Thực hiện rollback</text><text x="1045" y="330">Hệ thống ổn định</text></g></g><g stroke="#8793a5" stroke-width="3"><line x1="205" y1="245" x2="310" y2="245"/><line x1="430" y1="245" x2="535" y2="245"/><line x1="655" y1="245" x2="760" y2="245"/><line x1="880" y1="245" x2="985" y2="245"/></g><g fill="#8793a5"><path d="M302 238l14 7-14 7z"/><path d="M527 238l14 7-14 7z"/><path d="M752 238l14 7-14 7z"/><path d="M977 238l14 7-14 7z"/></g><rect x="90" y="395" width="1020" height="115" rx="16" fill="#fff" stroke="#f0d9a1"/><text x="120" y="430" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#8a5a00">Trước khi maintenance bắt đầu, trigger cần đủ rõ để trả lời:</text><g font-family="Arial,sans-serif" font-size="17" fill="#475467"><text x="120" y="465">• Ảnh hưởng đến bao nhiêu người dùng / bộ phận?</text><text x="600" y="465">• Có mất dữ liệu hay không?</text><text x="120" y="495">• Thời gian phục hồi nếu rollback?</text><text x="600" y="495">• Tiếp tục thay đổi có rủi ro lớn hơn rollback?</text></g></svg>