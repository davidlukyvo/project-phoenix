<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Sự tiến hóa của câu hỏi Engineering</title><desc id="d">Từ triển khai thiết bị đến service validation, resilience và governance.</desc><rect width="1200" height="520" rx="28" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="70" y="72" font-size="34" font-weight="800" fill="#172033">Công nghệ thay đổi, nhưng thứ trưởng thành nhất là câu hỏi</text><g fill="#fff" stroke="#d8e1eb" stroke-width="2"><rect x="70" y="145" width="230" height="190" rx="22"/><rect x="335" y="145" width="230" height="190" rx="22"/><rect x="600" y="145" width="230" height="190" rx="22"/><rect x="865" y="145" width="265" height="190" rx="22"/></g><g fill="#183b66" font-size="22" font-weight="800"><text x="95" y="188">DEPLOY</text><text x="360" y="188">VALIDATE</text><text x="625" y="188">RESILIENCE</text><text x="890" y="188">GOVERNANCE</text></g><g fill="#344054" font-size="18"><text x="95" y="230">Thiết bị đã lên?</text><text x="95" y="262">Config đúng?</text><text x="95" y="294">Traffic đi qua?</text><text x="360" y="230">Failover thật?</text><text x="360" y="262">Service usable?</text><text x="360" y="294">Rollback rõ?</text><text x="625" y="230">Recover được?</text><text x="625" y="262">Quan sát đủ?</text><text x="625" y="294">Dependency nào?</text><text x="890" y="230">Ai được làm gì?</text><text x="890" y="262">Evidence ở đâu?</text><text x="890" y="294">Tổ chức lặp lại được?</text></g><g fill="#2f6bd1"><path d="M305 240h24l-12-12m12 12-12 12" stroke="#2f6bd1" stroke-width="4" fill="none"/><path d="M570 240h24l-12-12m12 12-12 12" stroke="#2f6bd1" stroke-width="4" fill="none"/><path d="M835 240h24l-12-12m12 12-12 12" stroke="#2f6bd1" stroke-width="4" fill="none"/></g><text x="600" y="420" text-anchor="middle" font-size="27" font-weight="800" fill="#172033">Senior Engineering không chỉ là biết nhiều sản phẩm hơn.</text><text x="600" y="458" text-anchor="middle" font-size="20" fill="#667085">Đó là nhìn thấy failure, dependency, operational risk và business outcome sớm hơn.</text></g></svg>