<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Read-only và change operation</title><desc id="d">So sánh mức rủi ro và cách kiểm soát giữa read-only operation và change operation trong Bastion access.</desc><rect width="1200" height="620" fill="#f8fafc"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Read-only operation và change operation không nên được đối xử giống nhau</text><g font-family="Arial,sans-serif"><rect x="80" y="150" width="470" height="360" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="315" y="205" text-anchor="middle" font-size="25" font-weight="800" fill="#2f6b46">READ-ONLY</text><g font-size="19" fill="#39465e"><circle cx="135" cy="270" r="9" fill="#2f8b57"/><text x="165" y="277">View process và container status</text><circle cx="135" cy="330" r="9" fill="#2f8b57"/><text x="165" y="337">Read application logs</text><circle cx="135" cy="390" r="9" fill="#2f8b57"/><text x="165" y="397">Inspect metadata</text></g><text x="315" y="465" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6b46">Lower operational risk</text><rect x="650" y="150" width="470" height="360" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="885" y="205" text-anchor="middle" font-size="25" font-weight="800" fill="#b54708">CHANGE</text><g font-size="19" fill="#39465e"><circle cx="705" cy="270" r="9" fill="#d97706"/><text x="735" y="277">Restart service</text><circle cx="705" cy="330" r="9" fill="#d97706"/><text x="735" y="337">Change runtime state</text><circle cx="705" cy="390" r="9" fill="#d97706"/><text x="735" y="397">Potential business impact</text></g><text x="885" y="465" text-anchor="middle" font-size="20" font-weight="700" fill="#b54708">Explicit approval scope</text><text x="600" y="565" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Tách capability giúp policy dễ review và blast radius dễ hiểu hơn.</text></g></svg>