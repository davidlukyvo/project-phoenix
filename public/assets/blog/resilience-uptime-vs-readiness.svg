<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Uptime không đồng nghĩa với Resilience</title><desc id="d">So sánh Uptime với khả năng chuẩn bị, phát hiện, ứng phó, phục hồi và học hỏi.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fff8f3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b66" flood-opacity=".12"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="60" y="78" font-size="22" font-weight="700" fill="#183b66">UPTIME</text><text x="60" y="118" font-size="36" font-weight="800" fill="#172033">Hệ thống còn chạy</text><text x="725" y="78" font-size="22" font-weight="700" fill="#2f6b46">RESILIENCE</text><text x="725" y="116" font-size="32" font-weight="800" fill="#172033">Hệ thống sẵn sàng</text><text x="725" y="150" font-size="32" font-weight="800" fill="#172033">phục hồi khi có sự cố</text><rect x="55" y="175" width="470" height="335" rx="26" fill="#fff" stroke="#dfe5ec" filter="url(#s)"/><circle cx="290" cy="322" r="100" fill="none" stroke="#e8edf3" stroke-width="28"/><circle cx="290" cy="322" r="100" fill="none" stroke="#55a870" stroke-width="28" stroke-linecap="round" stroke-dasharray="620 20" transform="rotate(-90 290 322)"/><text x="290" y="313" text-anchor="middle" font-size="54" font-weight="800" fill="#172033">99.9%</text><text x="290" y="355" text-anchor="middle" font-size="20" fill="#667085">Availability</text><text x="290" y="458" text-anchor="middle" font-size="21" font-weight="700" fill="#2f6b46">“Hôm nay vẫn chạy.”</text><line x1="595" y1="230" x2="595" y2="470" stroke="#c7d2df" stroke-width="3"/><circle cx="595" cy="350" r="48" fill="#183b66"/><text x="595" y="365" text-anchor="middle" font-size="52" font-weight="800" fill="#fff">≠</text><rect x="665" y="175" width="480" height="335" rx="26" fill="#fff" stroke="#dfe5ec" filter="url(#s)"/><g transform="translate(720 220)"><circle r="24" fill="#e6f4ea"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Prevent</text></g><g transform="translate(720 280)"><circle r="24" fill="#fff1e8"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Detect</text></g><g transform="translate(720 340)"><circle r="24" fill="#fdecec"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Respond</text></g><g transform="translate(720 400)"><circle r="24" fill="#e8f1ff"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Recover</text></g><g transform="translate(720 460)"><circle r="24" fill="#f0eaff"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Learn</text></g><path d="M720 220 C970 170 1080 250 1080 340 C1080 425 970 505 720 460" fill="none" stroke="#2f6bd1" stroke-width="8" stroke-linecap="round" opacity=".7"/><text x="600" y="590" text-anchor="middle" font-size="26" font-weight="800" fill="#172033">Uptime kể chuyện lúc hệ thống chưa gặp sự cố.</text><text x="600" y="630" text-anchor="middle" font-size="21" fill="#667085">Resilience kể chuyện chúng ta sẽ làm gì khi sự cố thật sự xảy ra.</text></g></svg>