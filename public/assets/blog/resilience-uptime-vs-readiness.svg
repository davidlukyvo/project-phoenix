<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Uptime không đồng nghĩa với Resilience</title><desc id="d">So sánh Uptime với khả năng chuẩn bị, phát hiện, ứng phó, phục hồi và học hỏi.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fff8f3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b66" flood-opacity=".12"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#183b66">UPTIME</text><text x="60" y="120" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#172033">Hệ thống còn chạy</text><text x="725" y="80" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2f6b46">RESILIENCE</text><text x="725" y="120" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#172033">Hệ thống sẵn sàng phục hồi</text><rect x="55" y="160" width="470" height="350" rx="26" fill="#fff" stroke="#dfe5ec" filter="url(#s)"/><circle cx="290" cy="315" r="105" fill="none" stroke="#e8edf3" stroke-width="28"/><circle cx="290" cy="315" r="105" fill="none" stroke="#55a870" stroke-width="28" stroke-linecap="round" stroke-dasharray="650 20" transform="rotate(-90 290 315)"/><text x="290" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="56" font-weight="800" fill="#172033">99.9%</text><text x="290" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#667085">Availability</text><text x="290" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#2f6b46">“Hôm nay vẫn chạy.”</text><line x1="595" y1="220" x2="595" y2="470" stroke="#c7d2df" stroke-width="3"/><circle cx="595" cy="345" r="48" fill="#183b66"/><text x="595" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#fff">≠</text><rect x="665" y="160" width="480" height="350" rx="26" fill="#fff" stroke="#dfe5ec" filter="url(#s)"/><g font-family="Arial,sans-serif"><g transform="translate(720 210)"><circle cx="0" cy="0" r="24" fill="#e6f4ea"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Prevent</text></g><g transform="translate(720 275)"><circle cx="0" cy="0" r="24" fill="#fff1e8"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Detect</text></g><g transform="translate(720 340)"><circle cx="0" cy="0" r="24" fill="#fdecec"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Respond</text></g><g transform="translate(720 405)"><circle cx="0" cy="0" r="24" fill="#e8f1ff"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Recover</text></g><g transform="translate(720 470)"><circle cx="0" cy="0" r="24" fill="#f0eaff"/><text x="45" y="8" font-size="21" font-weight="700" fill="#172033">Learn</text></g><path d="M720 210 C970 160 1080 245 1080 335 C1080 425 970 520 720 470" fill="none" stroke="#2f6bd1" stroke-width="8" stroke-linecap="round" opacity=".7"/></g><text x="600" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#172033">Uptime kể chuyện lúc hệ thống chưa gặp sự cố.</text><text x="600" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#667085">Resilience kể chuyện chúng ta sẽ làm gì khi sự cố thật sự xảy ra.</text></svg>