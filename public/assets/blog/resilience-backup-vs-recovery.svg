<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Backup Success chưa phải Recovery</title><desc id="d">Minh họa sự khác nhau giữa backup job thành công và khả năng khôi phục workload thực tế.</desc><rect width="1200" height="620" fill="#f8fafc"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">Backup Success chưa phải bằng chứng Recovery</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="19" fill="#667085">Dữ liệu đã được ghi lại ≠ workload chắc chắn phục hồi đúng lúc, đúng trạng thái và đúng dependency.</text><g font-family="Arial,sans-serif"><rect x="70" y="165" width="300" height="320" rx="24" fill="#fff" stroke="#dfe5ec"/><circle cx="220" cy="255" r="55" fill="#e6f4ea"/><path d="M190 255l20 20 42-48" fill="none" stroke="#2f8b57" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="345" text-anchor="middle" font-size="25" font-weight="800" fill="#172033">Backup Job</text><text x="220" y="385" text-anchor="middle" font-size="21" font-weight="700" fill="#2f8b57">SUCCESS</text><text x="220" y="430" text-anchor="middle" font-size="17" fill="#667085">Data written successfully</text><text x="220" y="458" text-anchor="middle" font-size="17" fill="#667085">Retention intact</text><circle cx="600" cy="330" r="52" fill="#183b66"/><text x="600" y="346" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">≠</text><rect x="810" y="145" width="320" height="360" rx="24" fill="#fff" stroke="#dfe5ec"/><text x="970" y="205" text-anchor="middle" font-size="25" font-weight="800" fill="#172033">Recovery</text><g font-size="18" fill="#39465e"><circle cx="855" cy="260" r="8" fill="#2f6bd1"/><text x="880" y="266">Restore đúng workload</text><circle cx="855" cy="310" r="8" fill="#2f6bd1"/><text x="880" y="316">Dependency hoạt động</text><circle cx="855" cy="360" r="8" fill="#2f6bd1"/><text x="880" y="366">Network & permission đúng</text><circle cx="855" cy="410" r="8" fill="#2f6bd1"/><text x="880" y="416">Application state nhất quán</text><circle cx="855" cy="460" r="8" fill="#2f6bd1"/><text x="880" y="466">RTO/RPO đạt mục tiêu</text></g><path d="M395 330h130" stroke="#9aa8ba" stroke-width="6" stroke-linecap="round"/><path d="M675 330h110" stroke="#9aa8ba" stroke-width="6" stroke-linecap="round"/><text x="600" y="555" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Restore validation biến “niềm tin” thành evidence.</text></g></svg>