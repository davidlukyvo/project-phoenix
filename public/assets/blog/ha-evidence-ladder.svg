<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Thang bằng chứng High Availability</title><desc id="d">Configured, synchronized, failover tested, service validated và operational evidence là các mức trưởng thành khác nhau.</desc><rect width="1200" height="560" fill="#fff"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#172033">HA trưởng thành khi niềm tin dần được thay bằng evidence</text><g font-family="Arial,sans-serif"><rect x="90" y="365" width="180" height="95" rx="18" fill="#f2f4f7"/><text x="180" y="405" text-anchor="middle" font-size="20" font-weight="800" fill="#172033">CONFIGURED</text><text x="180" y="435" text-anchor="middle" font-size="15" fill="#667085">Có 2 node</text><rect x="295" y="315" width="180" height="145" rx="18" fill="#edf2f7"/><text x="385" y="365" text-anchor="middle" font-size="20" font-weight="800" fill="#172033">SYNCED</text><text x="385" y="397" text-anchor="middle" font-size="15" fill="#667085">Config / data đồng bộ</text><rect x="500" y="255" width="180" height="205" rx="18" fill="#fff1e8"/><text x="590" y="315" text-anchor="middle" font-size="20" font-weight="800" fill="#8a4b08">FAILOVER</text><text x="590" y="347" text-anchor="middle" font-size="15" fill="#667085">Role chuyển khi failure</text><rect x="705" y="185" width="180" height="275" rx="18" fill="#e8f1ff"/><text x="795" y="255" text-anchor="middle" font-size="20" font-weight="800" fill="#183b66">VALIDATED</text><text x="795" y="287" text-anchor="middle" font-size="15" fill="#667085">Service vẫn usable</text><rect x="910" y="105" width="200" height="355" rx="18" fill="#e6f4ea"/><text x="1010" y="185" text-anchor="middle" font-size="20" font-weight="800" fill="#2f6b46">OPERATIONAL</text><text x="1010" y="217" text-anchor="middle" font-size="15" fill="#667085">Runbook + evidence</text><text x="1010" y="247" text-anchor="middle" font-size="15" fill="#667085">Periodic test</text><text x="1010" y="277" text-anchor="middle" font-size="15" fill="#667085">Clear ownership</text><text x="1010" y="307" text-anchor="middle" font-size="15" fill="#667085">Known recovery behavior</text><path d="M120 500h980" stroke="#c7d2df" stroke-width="3"/><text x="600" y="535" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">Cấu hình HA là điểm bắt đầu. Khả năng vận hành qua failure mới là đích đến.</text></g></svg>